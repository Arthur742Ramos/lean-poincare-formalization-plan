name = "RicciScalarComparison"
version = "0.1.0"
keywords = ["math", "geometry", "ricci-flow"]
defaultTargets = ["PoincareCurvature", "RicciScalarComparison", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "PoincareCurvature"
srcDir = "vendor/curvature"
globs = ["PoincareCurvature.+"]

[[lean_lib]]
name = "RicciScalarComparison"
globs = ["RicciScalarComparison", "RicciScalarComparison.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
