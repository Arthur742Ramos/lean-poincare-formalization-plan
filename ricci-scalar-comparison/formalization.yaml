    - source: "Quadratic scalar-curvature reaction profile in the Einstein equality case"
      lean: "RicciScalarComparison.scalarCurvature_eq_quadraticScalarBarrier"
      module: "RicciScalarComparison/EinsteinScalar.lean"
      status: "proved"
      note: "Supporting bundled scalar-curvature computation with the exact dimensional constant."

