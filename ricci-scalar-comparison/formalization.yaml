# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sharp Einstein scalar comparison and Ricci-flow lifespan"
  description: >-
    Formalizes the exact shrinking Ricci flow generated by positive Einstein
    initial data on a nonempty compact smooth manifold. The selected theorem
    proves the homothetic metric formula, the componentwise Ricci-flow
    equation, equality with the quadratic scalar-curvature comparison
    profile, the exact positive-definite time interval ending at
    t0 + 1/(2*lambda), and the obstruction to realizing the collapsed endpoint
    tensor as a Riemannian metric. Curvature, Ricci, scalar curvature and the
    Levi-Civita conditions are explicit in the Mathlib-only Challenge.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.AP", "math.LO"]
  msc2020: ["53E20", "53C25", "03B35"]

sources:
  - title: "Three-manifolds with positive Ricci curvature"
    authors:
      - "Richard S. Hamilton"
    id: "10.4310/jdg/1214436922"
    type: "paper"
    location: "https://doi.org/10.4310/jdg/1214436922"
    relationship: "formalizes"
    note: >-
      Hamilton introduced Ricci flow and its curvature evolution framework.
      This project formalizes the classical positive-Einstein homothetic
      solution as the exact equality model for scalar comparison. It does not
      claim novelty, priority, or source-author endorsement.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/tree/0cc7c31bf6e2dac5c0359a432f3d99803f563017/curvature"
    relationship: "builds-on"
    note: >-
      Nineteen unchanged files and two narrowly adapted files are vendored from
      this immutable same-repository curvature and intrinsic Ricci-flow
      development. Exact blob identities, the adapted hashes, inventory and
      licensing are checked by scripts/check-vendored.py. The new scalar
      comparison, exact time-set and endpoint-obstruction results live in this
      package.
  - id: "https://github.com/qinz1yang/differential-geometry/tree/1b535dd102b94cc42b107cca27059687888f08b3"
    relationship: "independent"
    note: >-
      Independent Lean formalization associated with arXiv:2608.21502. It
      already includes the general scalar-curvature evolution and maximum
      principle infrastructure. This package does not import or vendor it and
      deliberately selects the narrower exact Einstein equality model instead
      of duplicating its general theorem.
  - id: "https://github.com/leanprover-community/mathlib4/tree/db584cd6d46c92f209a44c0f1c829460d327499d"
    relationship: "builds-on"
    note: >-
      Pinned Mathlib foundations for manifolds, tangent bundles, Riemannian
      metrics, covariant derivatives, finite-dimensional inner-product linear
      algebra, topology and real calculus.

status:
  scope: >-
    Nonzero finite-dimensional complete real model spaces and nonempty compact
    Hausdorff smooth manifolds with C2 tangent bundle and Riemannian metric.
    A C1 covariant derivative is assumed, together with supplied global C3
    tangent-vector extensions anchored at their base points, positive lambda,
    the torsion-free metric-compatible conditions, and the Einstein identity
    Ric(g0) = lambda*g0. The conclusion constructs a Riemannian metric family
    satisfying the componentwise Ricci-flow equation before the exact
    extinction time, computes scalar curvature as the quadratic barrier,
    identifies the positive homothetic-factor set, and rules out a Riemannian
    metric equal to the zero endpoint tensor. It does not prove general scalar
    evolution, a maximum principle for arbitrary flows, flow uniqueness, or
    nonhomothetic inextendibility.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "EinsteinComparisonEntry.einsteinScalarComparisonAndSharpLifespan"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        Comparator-selected Mathlib-facing theorem combining the actual
        Ricci-flow equation, sharp scalar equality profile, exact positivity
        interval and endpoint Riemannian-metric obstruction.
    - declaration: "RicciScalarComparison.scalarCurvature_eq_quadraticScalarBarrier"
      file: "RicciScalarComparison/EinsteinScalar.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        Computes the bundled scalar curvature of the homothetic Einstein slice
        and proves equality with the standard quadratic comparison profile.
    - declaration: "RicciScalarComparison.maximalEinsteinHomotheticIntrinsicSolution_timeSet"
      file: "RicciScalarComparison/EinsteinScalar.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: "Identifies the exact positive-definite time set with the half-line before extinction."
    - declaration: "RicciScalarComparison.no_riemannian_metric_agrees_at_extinction"
      file: "RicciScalarComparison/EinsteinScalar.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: "Rules out a Riemannian metric equal to the collapsed endpoint tensor."

