fidelity:
  divergences: >-
    The formalization selects the positive-Einstein equality model rather than
    Hamilton's full three-dimensional convergence theorem or the general
    scalar maximum-principle estimate. Ricci and scalar curvature are explicit
    orthonormal contractions of a corrected commutator evaluated on supplied
    smooth extensions. Compactness is exposed to supply the intrinsic
    sigma-compact infrastructure, although the Einstein computation is
    pointwise. The family is a genuine Riemannian metric for every real time by
    a fallback definition, while all flow and homothetic-equality conclusions
    are restricted to times before extinction. The endpoint theorem rules out
    equality with the collapsed homothetic tensor; it does not establish
    uniqueness or exclude every nonhomothetic continuation.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The statement, Challenge isolation, geometric bridges, overlap boundary,
    proof-hole policy, axiom surface, source identities and package metadata
    are mechanically checked. No independent human line-by-line proof review,
    Palomar editorial acceptance, intake or registration is claimed.

