name = "SymmetricTensorHeat"
version = "0.1.0"
keywords = ["math", "geometry", "parabolic-pde", "ricci-flow"]
defaultTargets = ["TensorHeatChallenge", "TensorHeatSolution", "TensorHeatGeometricSymmetry"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[lean_lib]]
name = "PoincareCurvature"
srcDir = "vendor/curvature"
# Keep the whole namespace local so transitive imports resolve, but build only
# the two vendored modules imported by the candidate entry points. Lake then
# follows their ordinary dependency closure without compiling the unrelated
# aggregate `PoincareCurvature.lean` root. check-package.py audits the globs.
roots = ["PoincareCurvature"]
globs = [
  "PoincareCurvature.Geometry.Manifold.RicciFlow.AnalyticPDE.TensorHeatAtlasSymmetricWellPosedness",
  "PoincareCurvature.Geometry.Manifold.RicciFlow.AnalyticPDE.TensorHeatAtlasGeometricUniqueness",
]

[[lean_lib]]
name = "TensorHeatChallenge"
roots = ["TensorHeatChallenge"]

[[lean_lib]]
name = "TensorHeatSolution"
roots = ["TensorHeatSolution"]

[[lean_lib]]
name = "TensorHeatGeometricSymmetry"
roots = ["TensorHeatGeometricSymmetry"]
