name = "SymmetricTensorHeat"
version = "0.1.0"
keywords = ["math", "geometry", "parabolic-pde", "ricci-flow"]
defaultTargets = ["TensorHeatChallenge", "TensorHeatSolution", "TensorHeatGeometricSymmetry"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "PoincareCurvature"
srcDir = "vendor/curvature"

[[lean_lib]]
name = "TensorHeatChallenge"
roots = ["TensorHeatChallenge"]

[[lean_lib]]
name = "TensorHeatSolution"
roots = ["TensorHeatSolution"]

[[lean_lib]]
name = "TensorHeatGeometricSymmetry"
roots = ["TensorHeatGeometricSymmetry"]
