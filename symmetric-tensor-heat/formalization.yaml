status:
  scope: >-
    Nonzero finite-dimensional complete real model spaces and nonempty compact
    Hausdorff boundaryless smooth manifolds with a C2 Riemannian tangent bundle,
    C3 vector-bundle structure and a C1 Levi-Civita connection. Supplied C1/C2
    induced connections on covariant two- and three-tensors define the actual
    orthonormal-trace rough Laplacian. For each 0 < alpha < 1, the conclusion
    constructs a positive short interval and a finite nonempty atlas. The
    compared proposition requires nonnegative weights summing to one, spanning
    local frames, normalized coordinates and time, positive source rescaling,
    exact local-to-global initial/source/solution/time-derivative reconstruction
    and local-frame coefficient identities. Initial/source/solution readouts
    are injective. The initial and source carriers cover every bounded spatial
    C2-alpha jet family and parabolic C-alpha source family satisfying the
    displayed conditions, with initial size equal to an explicit finite-atlas
    norm sum and source norm bounded by the supplied chartwise budgets.
    Constant-matrix witnesses independently certify nontriviality. The
    displayed norms control genuine spatial C2-alpha and parabolic
    C-alpha/C2-alpha derivative and Holder bounds. It then proves existence
    and uniqueness of the solution
    coefficient witness in the constructed classical class, fiberwise
    symmetry, initial trace, the componentwise inhomogeneous tensor heat
    equation, and an estimate of solution norm by initial size plus source
    norm. The displayed time derivative is genuine for every represented
    solution, including the pair quantified in the uniqueness clause. It also
    proves equality of any two represented geometric solutions
    with the same global data under the displayed trace and PDE. It does not
    prove that every bare intrinsic tensor section admits the constructed
    atlas representation, uniqueness outside the represented class, a
    prescribed arbitrary final time, nonlinear
    Ricci-DeTurck well-posedness, or mathematical novelty.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "SymmetricTensorHeatEntry.symmetricTensorHeatShortTimeWellPosed"
      file: "TensorHeatSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        Comparator-selected Mathlib-facing theorem for short-time existence,
        coefficient-class uniqueness, symmetry derived from geometric
        uniqueness, initial trace, the genuine connection-rough-Laplacian
        equation, represented geometric uniqueness for equal global data,
        and the global finite-atlas Schauder estimate. Unlike the historical
        rejected statement, this
        selected proposition itself constrains the atlas reconstruction of
        data, solution and time derivative, all admissible represented initial
        jets and sources with explicit input norm budgets, derivative fields,
        Holder bounds and norm control enough to exclude singleton/all-zero
        carriers.

