version: "v0.4"

project:
  name: "Short-time well-posedness for the symmetric tensor heat equation"
  description: >-
    Formalizes a finite-atlas Schauder-class existence, uniqueness and a priori
    estimate theorem for the inhomogeneous heat equation on symmetric covariant
    two-tensors over a nonempty closed smooth Riemannian manifold. The equation
    uses the actual Levi-Civita rough Laplacian tr_g(nabla^2 u), expanded in the
    Mathlib-only Challenge through induced tensor connections and an
    orthonormal trace. The selected statement exposes its finite nonempty
    atlas, partition weights and spanning frames, exact local-to-global data,
    solution and time-derivative reconstruction, faithful coefficient readouts,
    coverage of all bounded spatial C2-alpha atlas jet families and parabolic
    C-alpha source families with explicit chartwise norm budgets, genuine
    derivative and Holder bounds, and the norms used by the estimate. For every
    represented symmetric C^{2+alpha} initial datum and represented symmetric
    C^{alpha,alpha/2} source, the theorem constructs a positive time interval
    and a unique atlas coefficient witness whose geometric readout is
    symmetric, has the correct initial trace, solves the tensor heat equation,
    and obeys a global finite-atlas C^{2+alpha,1+alpha/2} estimate.
    Every represented solution has the displayed genuine time derivative.
    Any two represented geometric readouts with the same global initial tensor
    and source also agree when both satisfy the displayed trace and heat
    equation, without a matching-chartwise-trace premise.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.AP", "math.LO"]
  msc2020: ["53E20", "35K51", "35B45", "03B35"]

sources:
  - title: "The Cauchy problem for fully nonlinear parabolic systems on manifolds"
    authors:
      - "Hong Huang"
    id: "arXiv:1506.05030"
    type: "paper"
    location: "https://arxiv.org/abs/1506.05030"
    relationship: "adapts"
    note: >-
      Section 2 states global Schauder estimates and existence and uniqueness
      for linear strongly parabolic systems on vector bundles over closed
      manifolds. This project formalizes the second-order connection-rough-
      Laplacian specialization for symmetric covariant two-tensors using an
      explicit finite atlas. It does not claim mathematical novelty, priority,
      source-author endorsement, or the full generality of Huang's theorem.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Three-manifolds with positive Ricci curvature"
    authors:
      - "Richard S. Hamilton"
    id: "10.4310/jdg/1214436922"
    type: "paper"
    location: "https://doi.org/10.4310/jdg/1214436922"
    relationship: "background"
    note: >-
      Hamilton's foundational Ricci-flow paper develops short-time existence,
      weakly parabolic systems, tensor interpolation and curvature evolution.
      It motivates the geometric parabolic infrastructure formalized here but
      is not presented as the direct source of this exact coefficient-space
      theorem.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Deforming metrics in the direction of their Ricci tensors"
    authors:
      - "Dennis M. DeTurck"
    id: "10.4310/jdg/1214509286"
    type: "paper"
    location: "https://doi.org/10.4310/jdg/1214509286"
    relationship: "background"
    note: >-
      DeTurck reduces Ricci-flow local existence to classical strictly
      parabolic systems. The present linear tensor-heat theorem supplies a
      formally verified analytic building block for that strategy; it does not
      formalize the nonlinear gauge argument in this entry.
    license: "unknown"
    author_endorsement: "not-contacted"

