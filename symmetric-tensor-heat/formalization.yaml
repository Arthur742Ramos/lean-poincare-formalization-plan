status:
  scope: >-
    Nonzero finite-dimensional complete real model spaces and nonempty compact
    Hausdorff boundaryless smooth manifolds with a C2 Riemannian tangent bundle,
    C3 vector-bundle structure and a C1 Levi-Civita connection. Supplied C1/C2
    induced connections on covariant two- and three-tensors define the actual
    orthonormal-trace rough Laplacian. For each 0 < alpha < 1, the conclusion
    constructs a positive short interval, finite-atlas initial/source/solution
    coefficient types, geometric readouts, existence and uniqueness of the
    solution coefficient witness in the constructed classical class,
    fiberwise symmetry, initial trace, the componentwise inhomogeneous tensor
    heat equation, and a nonnegative-constant estimate of solution norm by
    initial size plus source norm. It does not prove that every bare intrinsic
    tensor section admits the constructed atlas representation, uniqueness
    outside the represented coefficient class, a prescribed arbitrary final
    time, nonlinear Ricci-DeTurck well-posedness, or mathematical novelty.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "SymmetricTensorHeatEntry.symmetricTensorHeatShortTimeWellPosed"
      file: "TensorHeatSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      note: >-
        Comparator-selected Mathlib-facing theorem for short-time existence,
        coefficient-class uniqueness, symmetry, initial trace, the genuine
        connection-rough-Laplacian equation and the global finite-atlas
        Schauder estimate.

