fidelity:
  divergences: >-
    The Laplacian uses the div-grad sign convention, so eigenfunctions satisfy
    laplacian f = -lambda*f. The source's nonnegative Laplacian has the opposite
    sign. The statement covers closed manifolds, not the full noncompact
    complete Hessian-rigidity theorem. It asserts attainment and minimality,
    not the entire spectral decomposition or multiplicities. The sphere's
    radius is expressed by scaling the standard unit-sphere inclusion; the
    exact derivative identity specifies its round Riemannian metric and the
    Diffeomorph type includes a smooth inverse. All nine geometric definitions
    are compared independently. The one intentional Challenge theorem hole
    is excluded from the zero-hole implementation/Solution status and is
    never imported into their proof closure.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Mechanical verification and source alignment are distinct from independent
    human review and registry acceptance. This is a new entry candidate, not
    a version update to any earlier submission. No intake or public registration
    is authorized by package preparation alone.

alignment:
  namespace: "LichnerowiczObataEntry.Geometry independent surface; LichnerowiczObata implementation"
  statements:
    - source: "Lichnerowicz lower bound and Obata Theorems A, 1-2 (closed-manifold case)"
      lean: "LichnerowiczObataEntry.Geometry.lichnerowiczObata"
      module: "LichnerowiczObataChallenge.lean and LichnerowiczObataSolution.lean"
      status: "proved"
      note: "Independent complete eigenvalue and smooth round-metric equality theorem."
    - source: "Obata, Section 2, Hessian rigidity"
      lean: "LichnerowiczObata.obata_round_metric_diffeomorph"
      module: "LichnerowiczObata/ObataRoundDiffeomorph.lean"
      status: "proved"
      note: "Actual global map, smooth pole extensions, smooth inverse, and induced metric."
    - source: "Obata, Section 2, sphere height sufficiency"
      lean: "LichnerowiczObata.round_metric_diffeomorph_exists_extremal_eigenfunction"
      module: "LichnerowiczObata/RoundSphereConverse.lean"
      status: "proved"
      note: "Derives the height Hessian and eigenvalue from the actual source metric."

