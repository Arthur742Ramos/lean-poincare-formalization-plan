project:
  name: "Supporting literal-C2 metric endpoint extension with continuous velocity"
  description: >-
    A source-reviewed, uncompiled endpoint construction on a compact smooth
    boundaryless manifold with arbitrary finite-dimensional model. A literal
    C2 initial Riemannian metric and an actual continuous symmetric tensor
    velocity yield an all-real-time positive C2 MetricFamily with exact initial
    value and ordinary two-sided HasDerivAt of fixed tangent components at the
    endpoint. Finite preferred cover, compact C2 buffers, actual uniformly
    continuous Gaussian smoothing, symmetric reconstruction and compact
    positivity reserve are constructed internally. It is not a PDE solution,
    a uniqueness theorem, a canonical Point-4 closure or a registry submission.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

