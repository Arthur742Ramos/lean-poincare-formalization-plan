version: "v0.4"

project:
  name: "Supporting two-sided ordinary initial heat derivative"
  description: >-
    An additive source-only supporting linear Euclidean construction. The
    nonnegative branch is the inherited actual heat path; the negative branch
    is f plus t times heat(-t) applied to the trace of the actual stored Hessian.
    It proves an ordinary pointwise initial time derivative with bounded actual
    C2 fixed slices, including rank zero. This is not backward heat, nonlinear
    or manifold existence, canonical Point-4 closure, or a registry submission.
    Exact Lean 4.33 compilation and mechanical qualification remain pending.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

sources:
  - title: "Verified bounded actual C2 initial heat trace and Gaussian smoothing"
    id: "https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/tree/e6b54dd0d7e73a51eb8efb083764b68ae8305a5a/curvature/PoincareCurvature/Geometry/Manifold/RicciFlow/AnalyticPDE"
    type: "formalization-source"
    relationship: "adapts"
    location: "EuclideanHeatInitialTrace.lean and EuclideanHeatHessianSemigroup.lean"
    note: >-
      Uses the actual right initial generator, Gaussian approximate identity,
      positive-time derivative witnesses and maximum principle without changing
      their proofs. The new left branch joins the right derivative to ordinary
      HasDerivAt at zero; no derivative of the generator, C3 regularity or
      positive initial Holder exponent is assumed.
    license: "Apache-2.0"
    author_endorsement: "n/a"
  - title: "Pinned real derivative and slope interfaces"
    id: "https://github.com/leanprover-community/mathlib4/tree/db584cd6d46c92f209a44c0f1c829460d327499d/Mathlib/Analysis/Calculus/Deriv"
    type: "formalization-source"
    relationship: "adapts"
    location: "Basic.lean and Slope.lean"
    note: >-
      Uses ordinary and within derivative interfaces and the one-sided slope
      limit equivalence to join the two sides. Mathlib source and contributor
      notices remain unchanged; this source-only adaptation still needs
      compilation against the exact pinned toolchain and Mathlib revision.
    license: "Apache-2.0"
    author_endorsement: "n/a"

