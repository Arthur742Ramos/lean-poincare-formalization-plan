status:
  scope: >-
    Supporting linear Euclidean scope only. Literal bounded actual C2 data,
    the genuine nonnegative heat path and ordinary HasDerivAt at zero are
    preserved. Fixed-slice C2 regularity does not establish negative-Hessian
    norm continuity, two-sided C2 path continuity, global positivity or cutoff.
    No canonical nonlinear/manifold or gauge theorem is claimed. Point 4 is OPEN.
    The isolated R1 mathematical/source review is conditional on Lean checking.
    This release repairs source inventories only, preserving R1 math/probe bytes.
    Exact Lean 4.33 module/probe/full-build/axiom/kernel/audit gates remain pending.
  main_results: []

automation:
  methods:
    - method: "agent"
      framework: "Codex"
      tool_setup: >-
        Immutable-source/API inspection, additive supporting Lean authoring,
        source/provenance checks, adversarial validator fixtures and prepared
        exact-head type/axiom probes. No local Lean process, toolchain/cache
        expansion, remote mutation, publication or registry action was performed
        while preparing this source-only release.
      prompting_notes: >-
        Preserve f plus t times positive-heat smoothing of the actual generator
        for negative t, genuine ordinary initial time derivative and actual C2
        fixed slices including rank zero. Avoid C3/positive-Holder premises and
        any canonical completion claim.

