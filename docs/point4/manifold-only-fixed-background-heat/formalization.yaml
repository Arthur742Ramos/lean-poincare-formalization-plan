    An additive supporting proof milestone deriving actual C1 tensor-heat
    coefficients and scale-correct local zero-trace right inverses for the
    supplied literal C2 metric under BoundarylessManifold I M. A single global
    auxiliary C2 affine connection and its induced tensor regularity are
    constructed internally. This is local linear tensor heat, not nonlinear
    Ricci-DeTurck existence, initial-C2 global gluing, canonical Point-4 closure,
    or a registry submission. Exact Lean 4.33 verification and review are pending.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
