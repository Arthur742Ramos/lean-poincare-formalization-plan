name = "PoincareCurvature"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PoincareCurvature"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[require]]
name = "HamiltonIveyReaction"
path = "../hamilton-ivey-reaction"

[[lean_lib]]
name = "PoincareCurvature"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "DifferentialGeometry"
moreLeanArgs = ["-j1", "-M5632", "-DautoImplicit=false", "-DmaxSynthPendingDepth=3"]

[[lean_lib]]
name = "ChartPort"
moreLeanArgs = ["-j1", "-M5632", "-DautoImplicit=false", "-DmaxSynthPendingDepth=3"]
