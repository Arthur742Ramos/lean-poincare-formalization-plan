# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Diffeomorphism transport of connections and curvature in Lean"
  description: >-
    Formalizes the fixed-diffeomorphism transport of a covariant derivative on
    the tangent bundle of a smooth finite-dimensional manifold. The selected
    statements expose the tangent pushforward and pullback, define the
    pulled-back connection and raw curvature commutator, and prove transport
    of curvature and torsion together with preservation of metric compatibility
    and the Levi-Civita property. The result is a standard geometric
    naturality theorem family formalized from the repository's proved source;
    it is not claimed as an original mathematical discovery or as a proof of
    Ricci-flow local existence.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.AP", "math.LO"]
  msc2020: ["53C25", "53E20", "35K15", "03B35"]

sources:
  - title: "Foundations of Differential Geometry, Volume I"
    authors:
      - "Shoshichi Kobayashi"
      - "Katsumi Nomizu"
    id: "10.1007/978-1-4757-9966-8"
    type: "book"
    location: "https://link.springer.com/book/10.1007/978-1-4757-9966-8"
    relationship: "formalizes"
    note: >-
      The classical source for affine connections, torsion, curvature, and
      their natural transport under diffeomorphisms. The selected statements
      are the standard pullback-connection consequences of that theory, not a
      new theorem and not a claim that this repository originated the result.
    license: "unknown"
    author_endorsement: "not-contacted"

  - title: "Riemannian Manifolds: An Introduction to Curvature"
    authors:
      - "John M. Lee"
    id: "10.1007/978-3-319-91755-9"
    type: "book"
    location: "https://link.springer.com/book/10.1007/978-3-319-91755-9"
    relationship: "formalizes"
    note: >-
      Provides the standard Riemannian formulation in which a diffeomorphism
      pulls back the metric and its Levi-Civita connection. The Lean surface
      states metric compatibility through the explicit inner-product pullback
      equation and proves the corresponding connection transport.
    license: "unknown"
    author_endorsement: "not-contacted"

