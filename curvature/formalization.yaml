# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Frozen affine Ricci–DeTurck chart evolution in Lean"
  description: >-
    Formalizes the auditable analytic core of a frozen affine chart model:
    the augmented operator exponential, conservation of its scalar coordinate,
    the global affine ODE and its uniqueness/representation theorems, and
    explicit exponential growth and initial-data stability bounds. The
    selected model is stated over an arbitrary complete normed real vector
    space and does not claim the full nonlinear Ricci-flow PDE, Schauder
    estimates, or short-time existence theorem.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.AP", "math.DG", "math.LO"]
  msc2020: ["35B65", "35K15", "53E20", "03B35"]

sources:
  - title: "Deforming metrics in the direction of their Ricci tensors"
    authors:
      - "Dennis M. DeTurck"
    id: "10.4310/jdg/1214509286"
    type: "article"
    location: "https://doi.org/10.4310/jdg/1214509286"
    relationship: "background"
    note: >-
      Mathematical provenance for the Ricci–DeTurck gauge and the frozen-chart
      motivation. This submission does not claim DeTurck's nonlinear flow
      theorem or its original priority; its selected Lean model abstracts the
      frozen affine chart equation to bounded linear data `L` and `b`.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Functional Analysis and Semi-Groups"
    authors:
      - "Einar Hille"
      - "Ralph S. Phillips"
    id: "https://bookstore.ams.org/COLL/31"
    type: "book"
    location: "https://bookstore.ams.org/COLL/31"
    relationship: "formalizes"
    note: >-
      Mathematical source for the Banach-space operator-exponential evolution
      and its standard uniqueness and growth framework. The seven selected
      declarations are a kernel-checked formalization/adaptation of this
      affine autonomous result family in the frozen-chart model.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The selected Challenge surface is the explicit affine model over an
    arbitrary complete normed real vector space `E`, with bounded linear map
    `L`, source vector `b`, initial state `y₀`, and times `t₀,t`. The definition
    `affineAugment` exposes the block operator `(v,s) ↦ (L v + s • b, 0)`, and
    `affineFundamentalSolution` exposes the first coordinate of its operator
    exponential at `(y₀,1)`. No manifold, Hausdorff, sigma-compactness, or
    nonlinear Ricci-flow-solution assumption is hidden in the selected surface.
    `Challenge.lean` contains seven deliberate theorem holes and no definition
    holes.
  sorry_count: 7
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        Repository-scoped failure audit; theorem-boundary redesign; exact
        Challenge/Solution alignment; pinned Lean builds; source-closure and
        metadata checks; and independent Comparator/NanoDa replay over the
        frozen affine theorem surface.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex audited the failed submission, identified the provenance,
        documentation, and research-interest defects, selected the stronger
        frozen affine evolution boundary, authored the Challenge/Solution
        declarations, updated the comparator, verifier, metadata, and
        documentation, and ran reproducibility checks. Humans selected and
        approved the authorship, external sources, theorem boundary, scope
        limits, and final public artifact; they reviewed the mathematical
        interpretation and exact diff and authorized the public push and
        Palomar submission. Lean's kernel and the independent Comparator/NanoDa
        replay verify formal consistency and reproducibility, not authorship or
        novelty.
  spend_usd: "subscription-based"
  notes: |
    Fuller role and oversight record: the immutable repository document is
    https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/blob/COMMIT_TO_BE_PINNED/curvature/AGENT-CONTRIBUTION-04.md
    It records the agent's proof-engineering and packaging role separately from
    the human authors' mathematical selection, attribution, review, and
    publication responsibility. The pointer will be replaced by the immutable
    public commit that contains that document before submission.

fidelity:
  divergences: >-
    `Challenge.lean` imports only Mathlib and gives the exact block-operator
    and first-coordinate operator-exponential definitions, followed by the
    seven selected statement holes. `Solution.lean` imports the checked
    proof-bearing autonomous operator-exponential development and supplies
    exact wrappers for all seven statements. The model is intentionally the
    frozen affine Banach-space core, not the full nonlinear Ricci-flow PDE.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    This corrected candidate replaces the rejected parabolic-infrastructure
    selection with a stronger, auditable frozen affine evolution family: the
    explicit augmented orbit, conserved scalar coordinate, global affine ODE,
    uniqueness and representation, exponential growth, and Lipschitz
    initial-data stability. The results are standard and their mathematical
    sources are identified above; the repository makes no claim of original
    discovery or priority. The formalization contribution is the checked Lean
    boundary and its explicit frozen-chart interpretation, not an absent
    nonlinear Ricci-flow existence or Schauder theorem.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Augmented-flow scalar conservation"
      lean: "PoincareCurvature.Palomar.affineAugment_snd_orbit_eq_one"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The second coordinate of the augmented operator-exponential orbit is
        identically one, recovering the affine source term.
    - source: "Affine evolution initial value"
      lean: "PoincareCurvature.Palomar.affineFundamentalSolution_initial"
      module: "Solution.lean"
      status: "proved"
      note: "The explicit global affine evolution starts at the prescribed state."
    - source: "Frozen-chart affine ODE"
      lean: "PoincareCurvature.Palomar.hasDerivAt_affineFundamentalSolution"
      module: "Solution.lean"
      status: "proved"
      note: "The operator-exponential formula has derivative `L y + b` at every time."
    - source: "Global affine ODE uniqueness"
      lean: "PoincareCurvature.Palomar.affineODE_unique"
      module: "Solution.lean"
      status: "proved"
      note: "Two global solutions of the frozen affine equation agreeing once agree everywhere."
    - source: "Affine fundamental-solution representation"
      lean: "PoincareCurvature.Palomar.eq_affineFundamentalSolution_of_hasDerivAt"
      module: "Solution.lean"
      status: "proved"
      note: "Every global solution with the prescribed initial value is the explicit orbit."
    - source: "Exponential growth bound"
      lean: "PoincareCurvature.Palomar.norm_affineFundamentalSolution_le"
      module: "Solution.lean"
      status: "proved"
      note: "The augmented operator norm gives an explicit at-most-exponential whole-state bound."
    - source: "Continuous dependence on initial data"
      lean: "PoincareCurvature.Palomar.norm_affineFundamentalSolution_sub_le"
      module: "Solution.lean"
      status: "proved"
      note: "Two affine evolutions differ by an explicit exponential Lipschitz bound in their starts."

acknowledgements: >-
  Mathlib contributors for the real-analysis, normed-space, and
  operator-exponential infrastructure; the human authors for mathematical
  selection, authorship, attribution, review, and publication responsibility;
  and the Palomar Registry project for the statement/solution Comparator
  workflow.
