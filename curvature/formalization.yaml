# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Levi–Civita connections and metric-determined curvature invariants in Lean"
  description: >-
    Formalizes a coherent static Riemannian theorem family for smooth
    finite-dimensional manifolds: existence of a global C^1 Levi–Civita
    covariant derivative, independence of the bundled curvature tensor from
    the chosen Levi–Civita realization, symmetry of the Ricci contraction, and
    independence of both Ricci and scalar curvature from that realization.
    These are standard classical results assembled at the current Mathlib
    manifold/vector-bundle API boundary. The contribution claimed here is a
    kernel-checked Lean formalization of the theorem family and its bundled
    constructions, not a new mathematical discovery or a priority claim.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.LO"]
  msc2020: ["53C21", "53C25", "03B35"]

sources:
  - title: "Mathlib4 manifold and covariant-derivative infrastructure"
    authors:
      - "Mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    type: "software"
    location: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The development extends Mathlib's manifold, vector-bundle,
      covariant-derivative, torsion, and Riemannian APIs with a proved
      Levi–Civita existence and curvature-contraction layer.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "Foundations of Differential Geometry, Vol. I"
    authors:
      - "Shoshichi Kobayashi"
      - "Katsumi Nomizu"
    id: "https://books.google.com/books/about/Foundations_of_Differential_Geometry_Vol.html?id=ss7bEAAAQBAJ"
    type: "book"
    location: "https://books.google.com/books/about/Foundations_of_Differential_Geometry_Vol.html?id=ss7bEAAAQBAJ"
    relationship: "formalizes"
    note: >-
      The selected existence, curvature-independence, Ricci-symmetry, and
      trace-invariance statements are standard consequences of the classical
      fundamental theorem of Riemannian geometry and the usual curvature
      contraction identities. This is an explicit formalization/adaptation of
      that source-based theorem family, not an original theorem or priority
      claim; the repository supplies the Lean constructions and proofs.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The selected surface covers arbitrary smooth finite-dimensional model
    spaces, Hausdorff manifolds, tangent bundles with Riemannian structure,
    covariant derivatives, and the explicit C^1/C^2 regularity assumptions
    required by the source theorems. It selects five results connecting
    Levi–Civita existence to intrinsic curvature, Ricci, and scalar-curvature
    invariants. `Challenge.lean` contains eight deliberate holes: five
    theorem statement holes and three definition holes for the canonical
    bundled curvature tensor, Ricci curvature, and scalar curvature. The
    corresponding `Solution.lean` declarations use the actual constructions
    and proofs from the package.
  sorry_count: 8
  sorry_in_definitions: 3
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        Repository-scoped mathematical formalization and proof engineering;
        Challenge/Solution construction; pinned kernel builds; and independent
        Comparator/NanoDa replay.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex materially performed the Submission 03 candidate audit,
        theorem-surface drafting, exact Challenge/Solution declaration
        alignment, definition-hole setup, metadata and documentation updates,
        and reproducibility checks. The agent did not determine authorship,
        source priority, or mathematical novelty. Human authors selected and
        approved the theorem family, author list, source relationships, scope
        claims, and final artifact; Lean's kernel and the independent
        Comparator/NanoDa replay supplied automated checks.
  spend_usd: "subscription-based"
  notes: >-
    Fuller role and oversight record: the Submission 03 repository document
    `curvature/AGENT-CONTRIBUTION-03.md`. The final artifact metadata will pin
    that record to an immutable public commit. It distinguishes agent proof
    engineering from human mathematical selection, attribution, review, and
    submission responsibility.

fidelity:
  divergences: >-
    The Challenge imports only Mathlib and reconstructs the public vocabulary
    needed by the selected statements. Its three declarations of
    `CovariantDerivative.curvatureTensor`, `ricciCurvature`, and
    `scalarCurvature` are deliberate Comparator definition holes: their exact
    source types are exposed, while their bodies are supplied by the
    implementation in `Solution.lean` and its package imports. The five
    theorem declarations remain ordinary statement holes and are compared
    exactly. This is an intentional, documented statement/implementation
    separation for independent Comparator replay, not an omission from the
    proved source package.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Submission 03 is deliberately scoped to a larger static Riemannian package
    rather than repeating the accepted Bianchi surface or the earlier
    elementary commutator-skew and Levi–Civita-uniqueness wrappers. Its five
    results connect existence of the canonical connection to the curvature
    tensor and both of its principal contractions, giving a coherent
    metric-determined invariant layer. The underlying mathematics is standard;
    no original result or priority is claimed. Local preparation requires both
    `scripts/verify-palomar.sh` and the pinned
    `scripts/verify-comparator.sh` replay.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Existence of a global C^1 Levi–Civita connection"
      lean: "PoincareCurvature.Palomar.exists_contMDiffLeviCivitaConnection"
      module: "Solution.lean"
      status: "proved"
      note: >-
        A smooth finite-dimensional Riemannian manifold admits a covariant
        derivative that is torsion-free, metric-compatible, and C^1.
    - source: "Curvature tensor independence of the Levi–Civita realization"
      lean: "PoincareCurvature.Palomar.curvatureTensor_eq_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Two C^1 Levi–Civita covariant derivatives induce the same bundled
        curvature tensor pointwise.
    - source: "Ricci symmetry for a Levi–Civita connection"
      lean: "PoincareCurvature.Palomar.ricciCurvature_symm_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The trace contraction of the curvature tensor is symmetric under the
        stated regularity and Levi–Civita hypotheses.
    - source: "Ricci-curvature independence of the Levi–Civita realization"
      lean: "PoincareCurvature.Palomar.ricciCurvature_eq_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The Ricci contraction is the same for any two C^1 Levi–Civita
        covariant derivatives associated with the fixed metric.
    - source: "Scalar-curvature independence of the Levi–Civita realization"
      lean: "PoincareCurvature.Palomar.scalarCurvature_eq_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The scalar trace contraction is likewise independent of the chosen
        Levi–Civita covariant derivative.

acknowledgements: >-
  Mathlib contributors for the manifold, vector-bundle, covariant-derivative,
  torsion, and Riemannian infrastructure; Kobayashi and Nomizu and the
  classical differential-geometry literature for the standard theorem family
  formalized here; and the Palomar Registry project for the
  statement/solution Comparator workflow.
