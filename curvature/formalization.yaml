# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Parabolic Hölder localization and inverse stability in Lean"
  description: >-
    Formalizes a reusable anisotropic parabolic-analysis package for geometric
    PDE: the square-root time/spatial parabolic distance, compact finite-ball
    localization, pullback scaling, nonlinear reciprocal-difference bounds with
    explicit constants, and a derived finite-cover inverse-localization theorem.
    The selected result is a proof-bearing analytic framework for coefficient
    stability in coordinate Ricci–DeTurck arguments; it does not claim a
    Ricci-flow existence theorem or a new priority result.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.AP", "math.DG", "math.LO"]
  msc2020: ["35B65", "35K15", "53C44", "03B35"]

sources:
  - title: "Mathlib4 analysis and metric-space infrastructure"
    authors:
      - "Mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    type: "software"
    location: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The Challenge imports only Mathlib's real powers, norms, metric spaces,
      compactness, finite sets, and basic analysis infrastructure. The selected
      theorem proofs come from the PoincareCurvature source package.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "PoincareCurvature parabolic-analysis source package"
    authors:
      - "Arthur Freitas Ramos"
      - "David Barros Hulak"
      - "Ruy J. G. B. de Queiroz"
    id: "https://github.com/Arthur742Ramos/lean-poincare-formalization-plan"
    type: "software"
    location: "curvature/PoincareCurvature/Geometry/Manifold/RicciFlow/AnalyticPDE/ParabolicHolder.lean"
    relationship: "formalizes"
    note: >-
      The source modules prove the parabolic metric, exact anisotropic scaling,
      compact localization, pullback, Hölder closure, and nonlinear reciprocal
      estimates selected here. The added inverse-localization theorem is an
      explicit composition of those source lemmas, not a translation of a
      separately claimed external theorem. The result is presented as
      repository-level formalization and proof engineering, not as an original
      mathematical discovery or priority claim.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The selected domain is arbitrary pseudo-metric time-space `ℝ × X`; no
    manifold, Hausdorff, sigma-compactness, or Ricci-flow solution assumption
    is hidden in the stated surface. The package exposes the square-root
    time-weighted parabolic distance, open and closed parabolic balls,
    `ParabolicHolderWith`, `ParabolicBoundedWith`, `ParabolicC0AlphaWith`, and
    `ParabolicC0AlphaOn` with their actual formulas. It selects seven theorem
    statements: exact parabolic dilation scaling; dilation transport of the
    origin-centered closed ball; finite compact localization into
    closed-ball-controlled open covers; pullback scaling; finite-cover
    `C^{0,α}` globalization; explicit reciprocal-difference stability; and the
    derived finite-cover inverse-localization result. `Challenge.lean` contains
    seven deliberate theorem holes and no definition holes.
  sorry_count: 7
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        Repository-scoped source audit; exact Challenge/Solution alignment;
        pinned Lean builds; and independent Comparator/NanoDa replay over the
        parabolic theorem and definition surface.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex performed the source audit, selected the corrected analytic
        theorem cluster, drafted the Challenge/Solution declarations, added the
        finite-cover inverse-localization composition, updated the verifier and
        documentation, and ran reproducibility checks. Humans selected and
        approved the authorship, mathematical boundary, source relationship,
        scope limits, and final public artifact; they reviewed the source/diff
        and authorized the public push and Palomar submission. Lean's kernel and
        the independent Comparator/NanoDa replay verify formal consistency and
        reproducibility, not authorship or novelty.
  spend_usd: "subscription-based"
  notes: |
    Fuller role and oversight record: the immutable repository document is
    https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/blob/a10baaf326c0205fe47e9ff07be8dacb8738ff26/curvature/AGENT-CONTRIBUTION-04.md
    The document distinguishes agent proof engineering and packaging from
    human mathematical selection, attribution, review, and publication
    responsibility.

fidelity:
  divergences: >-
    `Challenge.lean` imports only Mathlib and reproduces the selected public
    vocabulary with auditable formulas. Its definitions are ordinary Lean
    definitions, not `sorry` declarations. `Solution.lean` imports the checked
    PoincareCurvature parabolic source modules and supplies exact wrappers for
    the seven selected statements, including the new finite-cover composition.
    No Ricci or scalar-curvature function is selected, and no theorem is
    represented by an unconstrained time-indexed repackaging.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    This corrected candidate replaces the failed time-indexed Levi–Civita
    surface. Its research-interest case is the connected analytic mechanism:
    exact anisotropic dilation and closed-ball transport feed compact
    finite-cover globalization, change-of-variables scaling, and explicit
    nonlinear reciprocal-difference control, culminating in a finite-cover
    inverse-localization theorem. That theorem family is directly reusable for
    inverse metric coefficients in geometric PDE chart estimates. The
    mathematical ingredients are standard and the repository makes no
    originality or priority claim; the contribution is the checked,
    compositional Lean artifact and its explicit constants.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Exact parabolic dilation scaling"
      lean: "PoincareCurvature.Palomar.parabolicDistance_dilation"
      module: "Solution.lean"
      status: "proved"
      note: "Scaling time by `r^2` and space by `r` scales the distance by exactly `|r|`."
    - source: "Dilation transport of the origin-centered closed ball"
      lean: "PoincareCurvature.Palomar.parabolicClosedBall_zero_mapsTo_dilation"
      module: "Solution.lean"
      status: "proved"
      note: "The exact dilation maps the closed ball of radius `ρ` into the ball of radius `|r| * ρ`."
    - source: "Finite compact parabolic localization"
      lean: "PoincareCurvature.Palomar.parabolicBall_exists_finset_cover_closedBall_subset_open_of_isCompact"
      module: "Solution.lean"
      status: "proved"
      note: "A compact subset of an open set admits a finite parabolic-ball cover whose matching closed balls stay inside the open set."
    - source: "Parabolic pullback scaling"
      lean: "PoincareCurvature.Palomar.parabolicC0AlphaWith_comp_parabolicDistanceLe"
      module: "Solution.lean"
      status: "proved"
      note: "A map with controlled parabolic-distance expansion transports `C^{0,α}` control with the explicit factor `L^α`."
    - source: "Finite-cover `C^{0,α}` globalization"
      lean: "PoincareCurvature.Palomar.parabolicC0AlphaOn_of_finset_parabolicBall_cover_closedBall"
      module: "Solution.lean"
      status: "proved"
      note: "Local existential bounded/Hölder controls on doubled closed balls globalize over a finite parabolic cover."
    - source: "Explicit reciprocal-difference stability"
      lean: "PoincareCurvature.Palomar.parabolicC0AlphaWith_inv_sub_inv"
      module: "Solution.lean"
      status: "proved"
      note: "The displayed reciprocal bound uses the actual `invSubBoundConst` and `invSubHolderConst` formulas under a common lower norm bound."
    - source: "Finite-cover inverse localization"
      lean: "PoincareCurvature.Palomar.parabolicC0AlphaOn_inverse_difference_of_finset_parabolicBall_cover_closedBall"
      module: "Solution.lean"
      status: "proved"
      note: "The repository-derived composition globalizes local controls for two nonvanishing families and their difference before applying reciprocal stability."

acknowledgements: >-
  Mathlib contributors for the real-analysis, normed-group, metric-space, and
  compactness infrastructure; the human authors for mathematical selection,
  authorship, attribution, review, and publication responsibility; and the
  Palomar Registry project for the statement/solution Comparator workflow.
