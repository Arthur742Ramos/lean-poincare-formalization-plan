version: "v0.4"

project:
  name: "Ricci-DeTurck pullback transport and metric-cone evolution in Lean"
  description: >-
    Formalizes an auditable coordinate reduction of the Ricci-DeTurck method.
    Metrics are continuous bilinear forms, the Ricci tensor is explicitly the
    metric composed with a specified Ricci endomorphism. Independent Frechet,
    gauge, and tangent-transport derivative data yield the derivative of the
    pulled-back metric. The capstone combines that calculation with the source
    Ricci-DeTurck equation and proves intrinsic -2 Ric evolution. A Ricci
    vector field on the same bilinear-form state space has a Picard-Lindelof
    existence and uniqueness theorem inside the symmetric positive-definite
    cone. A finite-dimensional scalar-trace transport lemma is retained as
    supporting code but is not selected as a standalone claim. This is a
    coordinate adaptation of the gauge mechanism, not the full nonlinear
    compact-manifold Ricci-flow existence theorem and not a claim of original
    mathematical discovery.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.AP", "math.LO"]
  msc2020: ["53C25", "53E20", "35K15", "03B35"]

sources:
  - title: "Deforming metrics in the direction of their Ricci tensors"
    authors:
      - "Dennis M. DeTurck"
    id: "10.4310/jdg/1214509286"
    type: "article"
    location: "https://doi.org/10.4310/jdg/1214509286"
    relationship: "adapts"
    note: >-
      This is the mathematical source for the Ricci-DeTurck gauge idea and
      the pullback reduction from a gauge-fixed equation to Ricci flow. The
      Lean result adapts that mechanism to an explicit fixed-tangent model;
      it does not purport to formalize DeTurck's full nonlinear parabolic
      short-time theorem or to claim priority for the underlying mathematics.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The selected Challenge surface is a typed time-dependent coordinate model
    over a normed base type M and a normed real tangent model E. A metric is a
    continuous bilinear form E ->L E ->L R. `ricciTensor` is metric composition
    with an explicitly supplied continuous Ricci endomorphism. The derivative
    theorem uses independent Frechet derivatives for the metric, time
    derivatives for the gauge, and time derivatives for the tangent transport.
    The final two theorems use the explicitly defined Ricci vector field on the
    bilinear-form state space and give Picard-Lindelof existence and uniqueness
    inside the positive-definite cone. The surface is not an
    arbitrary-Hausdorff-manifold regularity theorem and does not claim
    Schauder estimates or compact-manifold Ricci-flow local existence.
  sorry_count: 6
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        The agent audited the Palomar rejection, redesigned the Comparator
        boundary around typed bilinear forms and Ricci transport, implemented
        the Challenge/Solution declarations and proofs, synchronized the
        repository documents, and ran Lean, source-closure, metadata, and
        Comparator/NanoDa checks. Human authors selected and approved the
        mathematical target, source relationship, authorship, limitations,
        and submission decision.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex supplied proof engineering, repository editing, and
        reproducibility checks. It did not determine mathematical authorship,
        source priority, or novelty. Human oversight consisted of selecting
        the result family, reviewing the exact definitions and hypotheses,
        checking the provenance and limitations, and approving publication.
  spend_usd: "subscription-based"
  notes: |
    Fuller contribution and oversight record: the immutable public document is
    https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/blob/eb688e3462e70cc318d2394f19783e93620985f7/curvature/AGENT-CONTRIBUTION-04.md
    This immutable commit contains the corrected record and the synchronized
    Comparator surface.

fidelity:
  divergences: >-
    `Challenge.lean` imports only Mathlib and exposes the exact formulas and
    hypotheses compared by Palomar. `Solution.lean` proves the same
    declarations directly from pinned Mathlib calculus, linear-algebra, and
    ODE results. The larger manifold-level Ricci-flow files in the repository
    provide implementation context and source development, but are not
    imported into either compared surface, so no project-local theorem is
    hidden behind the Challenge boundary.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    This revision addresses the previous review by removing the stale
    frozen-affine Comparator description, replacing the unconstrained scalar
    Ricci family with typed bilinear and endomorphism data, removing the
    derivative theorem that assumed its conclusion, removing the routine
    standalone trace theorem from the selected surface, and specializing the
    metric-cone theorems to the explicitly defined Ricci vector field. The
    result remains explicitly presented as a standard adaptation of the
    Ricci-DeTurck mechanism rather than an original theorem or a claim of full
    nonlinear PDE local existence.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Gauge-pullback derivative from independent C1 data"
      lean: "PoincareCurvature.Palomar.gauge_pullback_has_derivAt_of_C1_data"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Applies the chain rule and two continuous-linear-map product rules to
        the explicitly defined pullback; the target derivative is not assumed.
    - source: "Ricci-tensor pullback transport"
      lean: "PoincareCurvature.Palomar.ricciTensor_pullback_transport"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The explicit definition `ricciTensor g R = g.comp R` makes the
        tangent-conjugation identity auditable by evaluation.
    - source: "Positive-definite metric pullback"
      lean: "PoincareCurvature.Palomar.pullbackMetric_preserves_symmetricPositiveDefinite"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The tangent transport is an equivalence, so symmetry and strict
        positivity of the source metric form are preserved by the explicit
        pullback formula. The correction-cancellation lemma and scalar trace
        transport are retained as internal supporting facts, not selected as
        standalone results.
    - source: "Typed intrinsic Ricci-flow gauge reduction"
      lean: "PoincareCurvature.Palomar.ricciDeTurckGaugeReduction"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Combines the independently derived pullback derivative, source
        cancellation, and Ricci-tensor transport into the intrinsic flow law.
    - source: "Metric-cone Picard-Lindelof existence"
      lean: "PoincareCurvature.Palomar.metricCone_local_flow_exists"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Constructs a local evolution for the explicitly defined Ricci vector
        field on bilinear forms that remains inside the symmetric-positive-
        definite metric cone under an explicit inclusion.
    - source: "Metric-cone solution uniqueness"
      lean: "PoincareCurvature.Palomar.metricCone_local_flow_unique"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Uses the state-constrained ODE uniqueness theorem on the common
        forward interval, retaining the cone hypotheses in the conclusion.

