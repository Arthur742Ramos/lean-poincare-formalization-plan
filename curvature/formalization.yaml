# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Time-dependent Levi–Civita families and curvature invariants in Lean"
  description: >-
    Formalizes an explicit-time geometric interface for smooth finite-dimensional
    Riemannian manifolds: slicewise Levi–Civita existence and regularity,
    background-independent Levi–Civita correction, and time-slice Ricci and
    scalar-curvature invariance. The time parameter is represented explicitly
    as an indexed family; this submission does not claim time differentiability,
    Ricci-flow existence, or a new mathematical theorem.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.LO"]
  msc2020: ["53C21", "53C25", "03B35"]

sources:
  - title: "Mathlib4 manifold and covariant-derivative infrastructure"
    authors:
      - "Mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    type: "software"
    location: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The development builds on Mathlib's manifold, tangent-bundle,
      covariant-derivative, regularity, and Riemannian APIs. The selected
      constructions and proofs are supplied by the PoincareCurvature source
      package rather than asserted as Mathlib theorems.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "Foundations of Differential Geometry, Vol. I"
    authors:
      - "Shoshichi Kobayashi"
      - "Katsumi Nomizu"
    id: "https://books.google.com/books/about/Foundations_of_Differential_Geometry_Vol.html?id=ss7bEAAAQBAJ"
    type: "book"
    location: "https://books.google.com/books/about/Foundations_of_Differential_Geometry_Vol.html?id=ss7bEAAAQBAJ"
    relationship: "formalizes"
    note: >-
      The classical source supplies the underlying fundamental theorem of
      Riemannian geometry, uniqueness of the Levi–Civita connection, and the
      standard curvature/Ricci contraction identities. The selected results
      are not presented as independently discovered: they are an explicit
      ℝ-indexed adaptation of those slicewise statements, implemented in
      `PoincareCurvature/.../CovariantDerivative/TimeDependent.lean` by
      applying the static constructions at each time. The repository's
      contribution is the Lean interface, proof integration, and checked
      regularity/invariance package; no priority claim is made.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The selected surface covers arbitrary smooth finite-dimensional model
    spaces, Hausdorff manifolds, C^2 time-indexed Riemannian metrics on the
    tangent bundle, time-indexed covariant derivatives, and the explicit
    slice-wise C^1 hypotheses used by the source results. It selects eight
    theorem statements: time-dependent Levi–Civita existence, correction
    correctness and regularity, background-family independence, regularity of
    every slicewise Levi–Civita family, Ricci symmetry, and Ricci/scalar
    invariance. `Challenge.lean` contains eleven deliberate holes: eight
    theorem holes and three definition holes for the time-dependent
    Levi–Civita correction, Ricci curvature, and scalar curvature. The
    corresponding `Solution.lean` declarations use the actual constructions
    and proofs from `TimeDependent.lean`.
  sorry_count: 11
  sorry_in_definitions: 3
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        Repository-scoped source audit; exact Challenge/Solution declaration
        alignment; pinned Lean builds; and independent Comparator/NanoDa
        replay with the time-dependent theorem and definition surface.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex materially performed the Submission 04 source audit of the
        time-dependent module, theorem-cluster selection proposal, exact
        Challenge/Solution drafting, definition-hole setup, Comparator and
        verifier updates, documentation, and reproducibility checks. The agent
        did not determine authorship, source priority, or mathematical novelty.
        Human authors selected and approved the theorem family, author list,
        source relationship, scope limits, and final public artifact; human
        oversight included review of the source and diff plus authorization of
        the public push. Lean's kernel and the independent Comparator/NanoDa
        replay supplied automated checks.
  spend_usd: "subscription-based"
  notes: >-
    Fuller role and oversight record: the immutable repository document at
    https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/blob/eee14606d83153a96223c31ad43d404d4f46b0ee/curvature/AGENT-CONTRIBUTION-04.md.
    It distinguishes agent proof
    engineering and packaging from human mathematical selection, attribution,
    review, and publication responsibility.

fidelity:
  divergences: >-
    The Challenge imports only Mathlib and reconstructs the public vocabulary
    needed by the selected statements: time-indexed covariant derivatives and
    Riemannian metrics, the slicewise Levi–Civita predicate, and the three
    time-dependent constructions. The declarations of
    `TimeDependentRiemannianMetric.leviCivitaConnection`, `ricciCurvature`,
    and `scalarCurvature` are deliberate Comparator definition holes: their
    exact source types are exposed, while their bodies are supplied by the
    implementation imported by `Solution.lean`. The eight theorem declarations
    remain ordinary statement holes and are compared exactly. This is an
    intentional statement/implementation separation for independent replay,
    not an omission from the proved source package.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Submission 04 is a library-level theorem cluster with an explicit time
    parameter. Its substantive boundary is the combination of existential
    slicewise selection, regularity transfer, background-independent
    Levi–Civita correction, and intrinsic Ricci/scalar invariants; it is not
    merely a renamed pointwise theorem. The mathematics is standard and is
    described as a formalization/adaptation, not as an original result. It does
    not claim time-dependent PDE estimates, short-time Ricci-flow existence, or
    any broader point-4 theorem.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Time-dependent Levi–Civita family existence with slice regularity"
      lean: "PoincareCurvature.Palomar.exists_contMDiffLeviCivitaConnection"
      module: "Solution.lean"
      status: "proved"
      note: >-
        A C^2 time-indexed metric family admits a slicewise Levi–Civita family
        whose slices are C^1.
    - source: "Slicewise Levi–Civita correction correctness"
      lean: "PoincareCurvature.Palomar.leviCivitaConnection_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The canonical correction of any background family is Levi–Civita for
        the metric family at each time.
    - source: "Regularity preservation by the slicewise correction"
      lean: "PoincareCurvature.Palomar.contMDiffCovariantDerivative_leviCivitaConnection"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Slice-wise C^1 regularity of the background family is preserved by the
        Levi–Civita correction.
    - source: "Background-family independence of the Levi–Civita correction"
      lean: "PoincareCurvature.Palomar.leviCivitaConnection_eq_leviCivitaConnection"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Any two background families produce the same corrected connection on
        smooth sections at every time.
    - source: "Regularity of every slicewise Levi–Civita family"
      lean: "PoincareCurvature.Palomar.contMDiffCovariantDerivative_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Under the compactness and metric hypotheses, every family satisfying
        the slicewise Levi–Civita predicate has the selected C^1 regularity.
    - source: "Time-slice Ricci symmetry for Levi–Civita families"
      lean: "PoincareCurvature.Palomar.ricciCurvature_symm_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The Ricci contraction is symmetric at each time under the stated
        regularity and manifold hypotheses.
    - source: "Time-dependent Ricci invariance"
      lean: "PoincareCurvature.Palomar.ricciCurvature_eq_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The Ricci contraction agrees for any two regular slicewise
        Levi–Civita families for the same metric family.
    - source: "Time-dependent scalar-curvature invariance"
      lean: "PoincareCurvature.Palomar.scalarCurvature_eq_of_isLeviCivita"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The scalar trace contraction likewise agrees for any two regular
        slicewise Levi–Civita families.

acknowledgements: >-
  Mathlib contributors for the manifold, vector-bundle, covariant-derivative,
  regularity, and Riemannian infrastructure; Kobayashi and Nomizu and the
  classical differential-geometry literature for the underlying theorem
  family; the human authors and reviewers for selection and verification; and
  the Palomar Registry project for the statement/solution Comparator workflow.
