# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Ricci-DeTurck gauge reduction and curvature transport in Lean"
  description: >-
    Formalizes the gauge-reduction identity behind the Ricci-DeTurck method.
    In a time-dependent bilinear-tensor model, an anchored gauge pulls back the
    metric and tangent data; when the source satisfies the Ricci-DeTurck
    equation and the gauge correction is subtracted, the transformed velocity
    is exactly the intrinsic `-2 Ric` velocity. The selected theorem family
    also proves preservation of the initial metric and invariance of the
    finite-dimensional Ricci trace under tangent-map conjugation. This is a
    geometric transport and cancellation result, not a claim of the full
    nonlinear compact-manifold Ricci-flow existence theorem.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.AP", "math.LO"]
  msc2020: ["53C25", "53C44", "35K15", "03B35"]

sources:
  - title: "Deforming metrics in the direction of their Ricci tensors"
    authors:
      - "Dennis M. DeTurck"
    id: "10.4310/jdg/1214509286"
    type: "article"
    location: "https://doi.org/10.4310/jdg/1214509286"
    relationship: "formalizes"
    note: >-
      The selected theorem family formalizes the Ricci-DeTurck gauge
      correction, its cancellation against the source equation, and the
      curvature transport readout in an explicit bilinear-tensor model. It
      does not claim DeTurck's full nonlinear short-time theorem or its
      original priority.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The selected Challenge surface is an explicit time-dependent bilinear
    tensor model over a point type `M` and a fixed normed real tangent model
    `E`. `pullbackBilinear` is the usual pullback by a gauge map and tangent
    transport. `SatisfiesDeTurckEquation` states the source Ricci-DeTurck
    equation after evaluation at the gauge image, and `IsIntrinsicRicciFlow`
    states scalar time differentiation together with the `-2 Ric` law. The
    seven compared declarations prove the gauge correction cancellation,
    derivative and initial-value readouts, the resulting intrinsic-flow
    theorem, and trace invariance under finite-dimensional conjugation. The
    development does not claim arbitrary compact-manifold local existence,
    Schauder estimates, or the Poincare Conjecture.
  sorry_count: 7
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        Repository-scoped audit of the prior Palomar review, theorem-boundary
        redesign toward the geometric Ricci-DeTurck gauge reduction, exact
        Challenge/Solution alignment, pinned Lean builds, source-closure and
        metadata checks, and independent Comparator/NanoDa replay.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex identified that the earlier frozen affine ODE selection was
        routine for Palomar's research-interest gate, then prepared this
        focused gauge-reduction and curvature-transport surface. Humans
        selected and approved the authorship, source relationship, theorem
        boundary, limitations, and publication decision. Lean kernel and
        independent Comparator/NanoDa replay verify formal consistency and
        reproducibility, not authorship or novelty.
  spend_usd: "subscription-based"
  notes: |
    Fuller role and oversight record: the immutable repository document is
    https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/blob/TO_BE_REPLACED/curvature/AGENT-CONTRIBUTION-04.md
    It records the agent's proof-engineering and packaging role separately from
    the human authors' mathematical selection, attribution, review, and
    publication responsibility. This pointer is replaced by the immutable
    public commit containing that document before Palomar intake.

fidelity:
  divergences: >-
    `Challenge.lean` imports only Mathlib and states the gauge pullback,
    Ricci-DeTurck source equation, corrected velocity, scalar derivative, and
    trace-conjugation identities in an explicit fixed-tangent-model setting.
    `Solution.lean` proves the same declarations and additionally imports the
    checked Ricci-flow gauge-transport development, whose concrete
    `GaugeReducedIntrinsicDeTurckLocalSolution` and
    `ResearchTheorems` results motivate and implement the selected boundary.
    The abstraction is intentional: it makes the mathematical statement
    auditable without importing the large project-specific manifold source
    closure into Challenge.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    This submission replaces the prior routine frozen affine Banach-space ODE
    selection with the geometric identity that gives the Ricci-DeTurck method
    its research relevance. The compared statements isolate the pullback
    metric, source-equation cancellation, initial-time anchoring, intrinsic
    Ricci-flow consequence, and curvature trace transport. The result is
    classical and is presented as a formalization/adaptation, not an original
    theorem or a claim of full Ricci-flow local existence.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Gauge pullback evaluation"
      lean: "PoincareCurvature.Palomar.pullbackBilinear_apply"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Identifies the pulled-back bilinear tensor with the usual metric and
        tangent-map evaluation at the gauge image.
    - source: "Ricci-DeTurck correction cancellation"
      lean: "PoincareCurvature.Palomar.gauge_corrected_velocity_eq_neg_two_pullbackRicci"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Subtracting the gauge correction from the source Ricci-DeTurck equation
        leaves exactly the pulled-back intrinsic `-2 Ric` term.
    - source: "Gauge-pulled metric derivative"
      lean: "PoincareCurvature.Palomar.gauge_reduction_has_derivAt"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Transfers the verified scalar time derivative of the pullback metric
        into the corrected velocity readout.
    - source: "Anchored initial metric preservation"
      lean: "PoincareCurvature.Palomar.anchored_pullbackBilinear_eq_initial"
      module: "Solution.lean"
      status: "proved"
      note: >-
        An anchored gauge and identity tangent transport at the initial time
        preserve the initial bilinear tensor.
    - source: "Intrinsic Ricci-flow gauge reduction"
      lean: "PoincareCurvature.Palomar.ricciDeTurckGaugeReduction"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Combines derivative data with Ricci-DeTurck cancellation to produce the
        intrinsic Ricci-flow law for the pulled-back metric.
    - source: "Curvature trace conjugation"
      lean: "PoincareCurvature.Palomar.trace_conjugation_invariant"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Proves the finite-dimensional Ricci trace is unchanged by tangent-map
        conjugation.
    - source: "Gauge-reduction curvature readout"
      lean: "PoincareCurvature.Palomar.gauge_reduction_trace_readout"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Applies trace conjugation to the scalar velocity readout used by the
        Ricci-DeTurck transport formula.

acknowledgements: >-
  Mathlib contributors for the calculus, normed-space, and finite-dimensional
  trace infrastructure; the human authors for mathematical selection,
  authorship, attribution, review, and publication responsibility; and the
  Palomar Registry project for the statement/solution Comparator workflow.
