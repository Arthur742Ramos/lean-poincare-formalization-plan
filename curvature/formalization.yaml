status:
  scope: >-
    The selected Challenge surface is a smooth finite-dimensional Hausdorff
    manifold with a bundled `C^2` self-diffeomorphism, its invertible tangent
    map, a covariant derivative on the tangent bundle, and the explicit raw
    curvature commutator. The selected metric statements quantify over smooth
    Riemannian metrics and include the pointwise equation identifying the
    target inner product with the pullback metric. The declarations therefore
    concern actual manifold connections and Levi-Civita structure, not an
    unconstrained endomorphism, scalar family, or generic ODE. This package
    proves geometric transport only; it does not claim Ricci-flow PDE local
    existence, Schauder estimates, or research novelty.
  sorry_count: 7
  sorry_in_definitions: 1
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        The agent audited the rejected coordinate and ODE candidates, selected
        the repository's strongest already-proved manifold transport family,
        implemented the aligned Challenge/Solution declarations, synchronized
        the repository documents and verifier, and ran Lean, source-closure,
        metadata, and Comparator/NanoDa checks. Human authors selected and
        approved the mathematical target, source relationship, authorship,
        limitations, and submission decision.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex supplied repository auditing, theorem-surface design,
        Lean proof engineering, documentation edits, and reproducibility
        checks. It did not determine mathematical authorship, source priority,
        or novelty. Human oversight consisted of selecting the result family,
        reviewing the exact definitions and hypotheses, checking the
        provenance and limitations, and approving the submission decision.
    - method: "agent"
      models: ["GPT-6.1 Sol"]
      framework: "Codex, requested High reasoning; Lean 4.33 target"
      tool_setup: >-
        The supporting bounded-C2 initial heat-trace candidate is developed in
        an isolated worktree. A separate author supplied the ambient compact
        modulus helper; the principal author supplied the finite-moment
        integral estimate, actual Gaussian instance, local/global initial
        traces and right endpoint generator, documentation and read-only
        exact-head workflow. Only bounded Mathlib-only development probes use
        the read-only Lean 4.35.0-rc2 cache. The compact-modulus helper passed
        that development check; the initial broad-import finite-moment probe
        hit its enforced 3GB guard without a proof result. Narrowed imports
        remain locally uncompiled. Exact Lean 4.33 verification of
        the assembled candidate is pending; no new registry entry is selected.
      prompting_notes: >-
        Human direction requested genuine C2 initial data without importing
        a positive-exponent Hessian modulus or treating the existing
        positive-time smoothing result as a new initial-face theorem. The
        canonical contract and auditor remain unchanged, and Point4 remains
        open. Source review and exact hosted verification are separate gates.
  spend_usd: "subscription-based"
  notes: |
    Fuller contribution and oversight record: [AGENT-CONTRIBUTION-05.md](https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/blob/e0f3438b55206b6bf443e07c907d199e3aa3e497/curvature/AGENT-CONTRIBUTION-05.md)
    is pinned to the immutable preparation commit that contains the record and
    the synchronized Comparator surface.

fidelity:
  divergences: >-
    `Challenge.lean` imports only Mathlib and exposes the tangent-map,
    covariant-derivative, curvature-commutator, torsion, and metric-compatibility
    formulas compared by Palomar. `Solution.lean` proves the same declarations
    by invoking the fully proved manifold transport source in the pinned
    repository. The source import is explicit in Solution.lean and is not
    available to Challenge.lean; the mathematical definitions and hypotheses
    remain visible at the Comparator boundary.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    This revision removes the stale affine, metric-cone, and gauge-reduction
    surface entirely. It selects the already-proved fixed-diffeomorphism
    transport of a genuine tangent-bundle connection, raw curvature, torsion,
    metric compatibility, and Levi-Civita structure. The relationship to the
    classical sources is stated as standard formalization/adaptation; no
    originality or Ricci-flow existence claim is made.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Raw curvature commutator under pullback connection"
      lean: "PoincareCurvature.Palomar.curvatureAux_pullbackCovariantDerivative"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The raw commutator is transported by the explicit pushforward/pullback
        connection formula and the naturality of the Lie bracket.
    - source: "Pointwise raw curvature transport"
      lean: "PoincareCurvature.Palomar.curvatureAux_pullbackCovariantDerivative_apply"
      module: "Solution.lean"
      status: "proved"
      note: >-
        This is the component-level form after applying the explicit inverse
        tangent map at the source point.
    - source: "Torsion transport under pullback connection"
      lean: "PoincareCurvature.Palomar.torsion_pullbackCovariantDerivative"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Torsion is transported pointwise by the inverse tangent map, with the
        differentiability hypotheses on the two tangent vector fields shown.
    - source: "Preservation of torsion-freeness"
      lean: "PoincareCurvature.Palomar.isTorsionFree_pullbackCovariantDerivative"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The pointwise torsion transport theorem gives the global predicate
        preservation result for a torsion-free affine connection.
    - source: "Preservation of metric compatibility"
      lean: "PoincareCurvature.Palomar.isMetricCompatibleTangent_pullbackCovariantDerivative"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The hypothesis explicitly identifies the target metric inner product
        with the tangent pullback of the source metric, so the transported
        compatibility statement is not vacuous.
    - source: "Preservation of the Levi-Civita property"
      lean: "PoincareCurvature.Palomar.isLeviCivita_pullbackCovariantDerivative"
      module: "Solution.lean"
      status: "proved"
      note: >-
        Combines the transported torsion-free and metric-compatibility
        properties for the explicitly pulled-back connection.

