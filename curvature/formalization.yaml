# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Tensoriality and metric skew-adjointness of raw curvature in Lean"
  description: >-
    Formalizes the core tensoriality behavior of the raw curvature commutator
    for covariant derivatives on smooth finite-dimensional manifolds. The
    selected results prove pointwise scalar linearity in the left tangent-field
    slot, the middle tangent-field slot, and the bundle-section slot, together
    with skew-adjointness of the curvature commutator under metric
    compatibility. These are standard differential-geometric identities; the
    contribution claimed here is their kernel-checked formalization with the
    regularity hypotheses exposed at the Mathlib manifold/vector-bundle API
    boundary, not a new discovery or a priority claim. The implementation also
    contains the resulting bundled curvature and Ricci/scalar contraction
    infrastructure, which is outside this selected surface.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

classification:
  arxiv: ["math.DG", "math.LO"]
  msc2020: ["53C21", "53C25", "03B35"]

sources:
  - title: "Mathlib4 manifold and covariant-derivative infrastructure"
    authors:
      - "Mathlib contributors"
    id: "https://github.com/leanprover-community/mathlib4"
    type: "software"
    location: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      The development extends Mathlib's manifold, vector-bundle,
      covariant-derivative, Lie-bracket, and Riemannian APIs with a proved raw
      curvature tensoriality and metric-compatibility layer.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "Foundations of Differential Geometry, Vol. I"
    authors:
      - "Shoshichi Kobayashi"
      - "Katsumi Nomizu"
    id: "https://books.google.com/books/about/Foundations_of_Differential_Geometry_Vol.html?id=ss7bEAAAQBAJ"
    type: "book"
    location: "https://books.google.com/books/about/Foundations_of_Differential_Geometry_Vol.html?id=ss7bEAAAQBAJ"
    relationship: "formalizes"
    note: >-
      Standard differential-geometry source relationship for the curvature
      tensoriality and metric-compatibility identities represented here. The
      submission makes no claim that the underlying mathematics is original;
      its claim is a kernel-checked Lean formalization at the stated API
      boundary.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The selected surface covers arbitrary smooth finite-dimensional model
    spaces, manifolds, vector bundles, covariant derivatives, and the stated
    C^1/C^2 regularity assumptions. It proves pointwise scalar linearity of
    the raw curvature commutator in all three slots, with the stronger global
    C^2 hypothesis required in the section slot, and proves the inner-product
    skew-adjointness identity for metric-compatible covariant derivatives.
    The four `sorry` declarations occur only as deliberate statement holes in
    `Challenge.lean`.
  sorry_count: 4
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent-assisted"
      models: ["GPT-5 Codex"]
      framework: "Codex with Lean 4.33 and Mathlib"
      tool_setup: >-
        Repository-scoped mathematical formalization and proof engineering;
        Challenge/Solution construction; pinned kernel builds; and independent
        Comparator/NanoDa replay.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        GPT-5 Codex materially performed the candidate audit, theorem-surface
        drafting, Challenge/Solution alignment, metadata and documentation
        updates, and reproducibility checks. The agent did not determine
        authorship, source priority, or mathematical novelty. Human authors
        selected and approved the theorem family, author list, source
        relationships, scope claims, and final artifact; Lean's kernel and
        the independent Comparator/NanoDa replay supplied automated checks.
  spend_usd: "subscription-based"
  notes: >-
    Fuller role and oversight record: the immutable repository document at
    https://github.com/Arthur742Ramos/lean-poincare-formalization-plan/blob/5b609f29b02b0352afaf5edf3e352c45922cf28d/curvature/AGENT-CONTRIBUTION-02.md
    . It distinguishes agent proof engineering from human mathematical
    selection, attribution, review, and submission responsibility.

fidelity:
  divergences: >-
    The Challenge reconstructs only the small public vocabulary needed by the
    selected raw curvature statements from Mathlib's underlying
    covariant-derivative API. The Solution imports the checked tensorial
    curvature implementation and proves the same four statements by its
    public theorem declarations. The surrounding implementation contains
    additional bundled and contracted curvature results. This is an
    intentional statement/implementation separation for Comparator replay.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Submission 02 is deliberately scoped to the nontrivial tensoriality and
    metric-compatibility layer rather than repeating the accepted Bianchi
    identity surface or selecting the elementary commutator-skew and
    Levi-Civita-uniqueness wrappers. The identities are standard; no original
    mathematical result or priority is claimed. Local preparation requires
    both `scripts/verify-palomar.sh` and the pinned
    `scripts/verify-comparator.sh` replay.

alignment:
  namespace: "PoincareCurvature.Palomar"
  statements:
    - source: "Pointwise scalar linearity of raw curvature in the left tangent-field slot"
      lean: "PoincareCurvature.Palomar.raw_curvature_left_tensoriality"
      module: "Solution.lean"
      status: "proved"
      note: >-
        A differentiable scalar multiplier is evaluated at the base point in
        the raw curvature commutator.
    - source: "Pointwise scalar linearity of raw curvature in the middle tangent-field slot"
      lean: "PoincareCurvature.Palomar.raw_curvature_middle_tensoriality"
      module: "Solution.lean"
      status: "proved"
      note: >-
        A differentiable scalar multiplier is evaluated at the base point in
        the second tangent-field input.
    - source: "Pointwise scalar linearity of raw curvature in the bundle-section slot"
      lean: "PoincareCurvature.Palomar.raw_curvature_right_tensoriality"
      module: "Solution.lean"
      status: "proved"
      note: >-
        A globally C^2 scalar multiplier is evaluated at the base point in the
        section input, with the commutator identity for the derivative of the
        Lie bracket supplying the cancellation.
    - source: "Metric-compatibility skew-adjointness of raw curvature"
      lean: "PoincareCurvature.Palomar.raw_curvature_metric_skew_adjointness"
      module: "Solution.lean"
      status: "proved"
      note: >-
        The inner products of the curvature commutator applied to two smooth
        sections cancel under the displayed metric-compatibility rule.

acknowledgements: >-
  Mathlib contributors for the manifold, vector-bundle, covariant-derivative,
  Lie-bracket, and Riemannian infrastructure; the classical
  differential-geometry literature for the standard identities formalized
  here; and the Palomar Registry project for the statement/solution
  Comparator workflow.
