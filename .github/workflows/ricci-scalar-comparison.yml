name: Ricci scalar comparison verification

on:
  push:
    paths:
      - "ricci-scalar-comparison/**"
      - ".github/workflows/ricci-scalar-comparison.yml"
  pull_request:
    paths:
      - "ricci-scalar-comparison/**"
      - ".github/workflows/ricci-scalar-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Proof, package boundary, provenance, and axioms
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: ricci-scalar-comparison
          build: false
      - name: Install metadata validators
        run: python3 -m pip install PyYAML==6.0.2 jsonschema==4.25.1
      - name: Check package shape, source identities, and metadata
        run: python3 ricci-scalar-comparison/scripts/check-package.py
      - name: Build all proof libraries and the independent pair
        run: lake build
        working-directory: ricci-scalar-comparison
      - name: Check selected transitive axiom surfaces
        run: python3 scripts/check-axioms.py
        working-directory: ricci-scalar-comparison
      - name: Check source dependencies and isolated Mathlib-only Challenge
        run: |
          lake env lean --src-deps Challenge.lean
          python3 scripts/check-challenge-boundary.py
        working-directory: ricci-scalar-comparison

  comparator:
    name: Linux Comparator and NanoDa with real Landrun
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: ricci-scalar-comparison
          build: false
      - name: Install Go for Landrun
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - name: Verify all selected definitions and the complete theorem
        run: bash ricci-scalar-comparison/scripts/verify-comparator.sh
      - name: Recheck the isolated Challenge
        run: python3 ricci-scalar-comparison/scripts/check-challenge-boundary.py
