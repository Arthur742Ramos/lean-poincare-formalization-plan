name: Contracted Bianchi verification

on:
  push:
    paths:
      - "contracted-bianchi/**"
      - ".github/workflows/contracted-bianchi.yml"
  pull_request:
    paths:
      - "contracted-bianchi/**"
      - ".github/workflows/contracted-bianchi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparator:
    name: Geometric contracted Bianchi - Linux Comparator and NanoDa
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: contracted-bianchi
          build: false
      - name: Install Go for Landrun
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - name: Verify using real Linux Landrun
        run: bash contracted-bianchi/scripts/verify-comparator.sh
      - name: Check Challenge without candidate library imports
        run: python3 contracted-bianchi/scripts/check-challenge-boundary.py
