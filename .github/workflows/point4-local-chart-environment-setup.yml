name: Point-4 local chart environment setup

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Independently reviewed full candidate commit SHA
        required: true
        type: string
      expected_tree:
        description: Independently reviewed full candidate Git tree SHA
        required: true
        type: string
      fixed_background_frame_c1:
        description: Verify only the reviewed PR148 fixed-background proof and probe
        required: false
        type: boolean
        default: false
      current_guard_real8:
        description: Verify the exact PR146 current guard and all eight original real routes
        required: false
        type: boolean
        default: false
      compiled_closure_transfer:
        description: Compile only the public dependency closure for separately reviewed local real8
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.compiled_closure_transfer && 'compiled-closure-transfer' || inputs.current_guard_real8 && 'current-guard-real8' || inputs.fixed_background_frame_c1 && 'fixed-background-frame-c1' || 'local-chart-connection' }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  chart_environment_setup:
    if: ${{ !inputs.fixed_background_frame_c1 && !inputs.current_guard_real8 && !inputs.compiled_closure_transfer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Admit exact candidate tree before running candidate code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          actual_tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$actual_tree" = "$EXPECTED_TREE"
          test "$(git rev-parse '1664872ce762ee027b76cb515befb0ae829b2711^{tree}')" = 6d74e9612cf6e16f2d027012cede68e5e0a23483
          git merge-base --is-ancestor 1664872ce762ee027b76cb515befb0ae829b2711 HEAD
          python3 curvature/scripts/chart_port_candidate_check.py --expected-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE"
      - name: Test chart driver resource and setup controls
        run: python3 -B curvature/scripts/test_chart_port_ci.py
      - name: Install the official pinned toolchain without build or caches
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: curvature
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Check pinned environment setup under owned resource limits
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/local-chart-environment-setup-$EXPECTED_SHA"
          sudo systemd-run --wait --pipe --collect \
            --unit="chart-port-setup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=6442450944 \
            --property=MemorySwapMax=0 --property=CPUQuota=200% \
            --property=OOMPolicy=kill --property=KillMode=control-group \
            --property=RuntimeMaxSec=1800 \
            --setenv="PATH=$PATH" \
            --setenv="ELAN_HOME=${ELAN_HOME:-$HOME/.elan}" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 curvature/scripts/chart_port_ci.py \
              --expected-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE" \
              --evidence "$evidence" --setup-only
      - name: Preserve setup-only receipts; full qualification remains required
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-chart-environment-setup-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-chart-environment-setup-${{ inputs.candidate_sha }}
          if-no-files-found: error

  fixed_background_frame_c1:
    if: ${{ inputs.fixed_background_frame_c1 && !inputs.current_guard_real8 && !inputs.compiled_closure_transfer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact workflow caller separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ci-control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable reviewed proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be78f44a992b01dfa082472a70a89360086ee1a2
          path: proof-source
          persist-credentials: false
          fetch-depth: 1
      - name: Run focused rejection and process cleanup controls
        run: python3 -B -m unittest discover -s ci-control/.github/scripts -p 'test_point4_fixed_background_ci.py'
      - name: Admit exact proof and caller sources before toolchain setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -B ci-control/.github/scripts/point4_fixed_background_ci.py \
            --phase preflight --candidate-root "$GITHUB_WORKSPACE/proof-source" \
            --control-root "$GITHUB_WORKSPACE/ci-control" \
            --candidate-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE" \
            --caller-sha "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/fixed-background-frame-c1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Install official pinned compiler without cache or project build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: proof-source/curvature
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Verify the focused proof under owned resource limits
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fixed-background-frame-c1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo systemd-run --wait --pipe --collect \
            --unit="fixed-background-frame-c1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$GITHUB_WORKSPACE/proof-source" \
            --property=MemoryMax=6442450944 --property=MemorySwapMax=0 \
            --property=CPUQuota=200% --property=TasksMax=128 \
            --property=OOMPolicy=kill --property=KillMode=control-group \
            --property=RuntimeMaxSec=3000 --property=TimeoutStopSec=10 \
            --setenv="PATH=$PATH" --setenv="ELAN_HOME=${ELAN_HOME:-$HOME/.elan}" \
            --setenv="MATHLIB_CACHE_DIR=$RUNNER_TEMP/fixed-background-frame-c1-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=LEAN_NUM_THREADS=1 \
            /usr/bin/python3 "$GITHUB_WORKSPACE/ci-control/.github/scripts/point4_fixed_background_ci.py" \
              --phase verify --candidate-root "$GITHUB_WORKSPACE/proof-source" \
              --control-root "$GITHUB_WORKSPACE/ci-control" \
              --candidate-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE" \
              --caller-sha "$GITHUB_SHA" --evidence "$evidence"
      - name: Preserve bounded exact-proof evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixed-background-frame-c1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixed-background-frame-c1-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  current_guard_real8:
    if: ${{ inputs.current_guard_real8 && !inputs.compiled_closure_transfer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      GIT_NO_LAZY_FETCH: '1'
    steps:
      - name: Reject conflicting verification modes
        env:
          FIXED_BACKGROUND: ${{ inputs.fixed_background_frame_c1 }}
        run: test "$FIXED_BACKGROUND" = false
      - name: Checkout exact workflow caller separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ci-control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable PR146 candidate and historical source objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 589f451ab90f0e258318dd07d2624dec7c399402
          path: proof-source
          persist-credentials: false
          fetch-depth: 0
      - name: Test exact input rejection and owned descendant cleanup
        run: python3 -B -m unittest discover -s ci-control/.github/scripts -p 'test_point4_real8_ci.py'
      - name: Admit exact proof, caller, historical probe and native closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -B ci-control/.github/scripts/point4_real8_ci.py \
            --phase preflight --candidate-root "$GITHUB_WORKSPACE/proof-source" \
            --control-root "$GITHUB_WORKSPACE/ci-control" \
            --candidate-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE" \
            --caller-sha "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/current-guard-real8-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --work "$RUNNER_TEMP/current-guard-real8-inputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Install official pinned compiler without cache or project build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: proof-source/curvature
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Install pinned Python validation dependencies in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/current-guard-real8-python"
          "$RUNNER_TEMP/current-guard-real8-python/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple \
            PyYAML==6.0.2 jsonschema==4.23.0
      - name: Compile minimal native closure, produce current context and run original real8
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/current-guard-real8-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo systemd-run --wait --pipe --collect \
            --unit="current-guard-real8-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$GITHUB_WORKSPACE/proof-source" \
            --property=MemoryMax=6442450944 --property=MemorySwapMax=0 \
            --property=CPUQuota=200% --property=TasksMax=128 \
            --property=OOMPolicy=kill --property=KillMode=control-group \
            --property=RuntimeMaxSec=15000 --property=TimeoutStopSec=10 \
            --setenv="PATH=$RUNNER_TEMP/current-guard-real8-python/bin:$PATH" \
            --setenv="ELAN_HOME=${ELAN_HOME:-$HOME/.elan}" \
            --setenv="MATHLIB_CACHE_DIR=$RUNNER_TEMP/current-guard-real8-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --setenv="EXPECTED_SHA=$EXPECTED_SHA" --setenv=PYTHONOPTIMIZE=0 \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=PYTHONNOUSERSITE=1 \
            --setenv=GIT_NO_LAZY_FETCH=1 --setenv=LEAN_NUM_THREADS=1 \
            "$RUNNER_TEMP/current-guard-real8-python/bin/python" -I -B \
              "$GITHUB_WORKSPACE/ci-control/.github/scripts/point4_real8_ci.py" \
              --phase verify --candidate-root "$GITHUB_WORKSPACE/proof-source" \
              --control-root "$GITHUB_WORKSPACE/ci-control" \
              --candidate-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE" \
              --caller-sha "$GITHUB_SHA" --evidence "$evidence" \
              --work "$RUNNER_TEMP/current-guard-real8-inputs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve fresh verification receipts and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-guard-real8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-guard-real8-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14

  compiled_closure_transfer:
    if: ${{ inputs.compiled_closure_transfer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EXPECTED_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      GIT_NO_LAZY_FETCH: '1'
    steps:
      - name: Reject conflicting modes before any build
        env:
          FIXED_BACKGROUND: ${{ inputs.fixed_background_frame_c1 }}
          CURRENT_REAL8: ${{ inputs.current_guard_real8 }}
        run: test "$FIXED_BACKGROUND" = false && test "$CURRENT_REAL8" = false
      - name: Checkout exact public CI caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: ci-control
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable candidate with historical Git objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 589f451ab90f0e258318dd07d2624dec7c399402
          path: proof-source
          persist-credentials: false
          fetch-depth: 0
      - name: Test capture and process ownership controls
        run: python3 -B -m unittest discover -s ci-control/.github/scripts -p 'test_point4_real8*.py'
      - name: Admit exact Source and 21-module closure before installing toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -B ci-control/.github/scripts/point4_real8_ci.py \
            --phase preflight --candidate-root "$GITHUB_WORKSPACE/proof-source" \
            --control-root "$GITHUB_WORKSPACE/ci-control" \
            --candidate-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE" \
            --caller-sha "$GITHUB_SHA" \
            --evidence "$RUNNER_TEMP/real8-public-compile-receipts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --work "$RUNNER_TEMP/real8-public-compile-output-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Install official pinned Lean without project build or caches
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: proof-source/curvature
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Compile and seal public build outputs under owned limits
        shell: bash
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect \
            --unit="real8-public-compile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$GITHUB_WORKSPACE/proof-source" \
            --property=MemoryMax=6442450944 --property=MemorySwapMax=0 \
            --property=CPUQuota=200% --property=TasksMax=128 \
            --property=OOMPolicy=kill --property=KillMode=control-group \
            --property=RuntimeMaxSec=5000 --property=TimeoutStopSec=10 \
            --setenv="PATH=$PATH" --setenv="ELAN_HOME=${ELAN_HOME:-$HOME/.elan}" \
            --setenv="MATHLIB_CACHE_DIR=$RUNNER_TEMP/real8-public-compile-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --setenv=PYTHONDONTWRITEBYTECODE=1 --setenv=LEAN_NUM_THREADS=1 \
            --setenv=PYTHONOPTIMIZE=0 --setenv=GIT_NO_LAZY_FETCH=1 \
            /usr/bin/python3 -I -B \
              "$GITHUB_WORKSPACE/ci-control/.github/scripts/point4_real8_compile_transfer_ci.py" \
              --candidate-root "$GITHUB_WORKSPACE/proof-source" \
              --control-root "$GITHUB_WORKSPACE/ci-control" \
              --candidate-sha "$EXPECTED_SHA" --expected-tree "$EXPECTED_TREE" \
              --caller-sha "$GITHUB_SHA" \
              --evidence "$RUNNER_TEMP/real8-public-compile-receipts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --work "$RUNNER_TEMP/real8-public-compile-output-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve small compile receipts including failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real8-public-compile-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real8-public-compile-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve only successful bounded public compiled payload
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real8-public-compiled-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real8-public-compile-output-${{ github.run_id }}-${{ github.run_attempt }}/export
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
