name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-doc-links.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - master
    paths:
      - "**/*.md"
      - "scripts/check-doc-links.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local documentation links
        run: python3 scripts/check-doc-links.py
