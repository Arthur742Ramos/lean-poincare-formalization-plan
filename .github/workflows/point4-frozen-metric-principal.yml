name: Point-4 actual frozen metric principal and Cauchy action

on:
  pull_request:
    paths:
      - "curvature/**"
      - ".github/workflows/point4-frozen-metric-principal.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen_metric_principal:
    name: Exact-head frozen metric principal and genuine holonomic action
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: curvature
          build: false
      - name: Compile genuine constant-linear derivative transport
        working-directory: curvature
        run: lake build PoincareCurvature.Analysis.LinearReadoutSecondDerivative
      - name: Compile actual preferred-frame frozen metric principal and Cauchy action
        working-directory: curvature
        run: lake build PoincareCurvature.Geometry.Manifold.RicciFlow.AnalyticPDE.ChosenLCFrozenTensorHeat
      - name: Check all supporting theorem axioms and interface regressions
        working-directory: curvature
        run: |
          lake env lean scripts/point4_frozen_metric_principal_probe.lean | tee /tmp/point4-frozen-metric-principal-axioms.log
          python3 - <<'PY'
          import pathlib, re
          output = pathlib.Path('/tmp/point4-frozen-metric-principal-axioms.log').read_text()
          entries = re.findall(r"'([^']+)' depends on axioms:\s*\[([^]]*)\]", output)
          clean = re.findall(r"'([^']+)' does not depend on any axioms?", output)
          expected = {
            'PoincareCurvature.second_fderiv_linear_readout',
            'RicciFlow.AnalyticPDE.localFrameInChart_preferred_eq_basis',
            'RicciFlow.AnalyticPDE.chosenLC_localFrameInverseGramMatrix_eq_inverse',
            'RicciFlow.AnalyticPDE.chosenLCFrozenTensorHeatPrincipalCoefficient_apply',
            'RicciFlow.AnalyticPDE.second_finiteCylinderTensorReadout',
            'RicciFlow.AnalyticPDE.deriv_finiteCylinderTensorReadout',
            'RicciFlow.AnalyticPDE.evalCLM_chosenLCFrozenTensorHeatCauchyL',
            'RicciFlow.AnalyticPDE.evalCLM_chosenLCFrozenTensorHeatCauchyL_eq_actual_derivatives',
          }
          assert {n for n, _ in entries} | set(clean) == expected, output
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name, axioms in entries:
            actual = {a.strip() for a in axioms.split(',') if a.strip()}
            assert actual <= allowed, (name, actual)
          print('All eight frozen metric principal and holonomic Cauchy axiom surfaces passed')
          PY
      - name: Run unchanged full Point-4 completion audit
        working-directory: curvature
        run: |
          set +e
          bash scripts/point4_audit.sh --json /tmp/point4-frozen-metric-principal-full-audit.json | tee /tmp/point4-frozen-metric-principal-full-audit.log
          audit_rc=${PIPESTATUS[0]}
          set -e
          export POINT4_AUDIT_RC="$audit_rc"
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path('/tmp/point4-frozen-metric-principal-full-audit.json').read_text())
          assert data['build_run'] is True, data
          assert data['gates']['G1_sorry_free']['status'] == 'PASS', data
          assert data['gates']['G2_build_green']['status'] == 'PASS', data
          if data['verdict'] == 'CLOSED':
            assert os.environ['POINT4_AUDIT_RC'] == '0', data
            assert all(g['status'] == 'PASS' for g in data['gates'].values()), data
          else:
            assert data['verdict'] == 'OPEN', data
            assert os.environ['POINT4_AUDIT_RC'] == '1', data
            print('POINT 4 OPEN: frozen metric principal identification and holonomic Cauchy action do not close the canonical theorem')
          PY
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: point4-frozen-metric-principal-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/point4-frozen-metric-principal-axioms.log
            /tmp/point4-frozen-metric-principal-full-audit.json
            /tmp/point4-frozen-metric-principal-full-audit.log
            /tmp/point4_build.log
          if-no-files-found: ignore
