name: Point-4 chosen Levi-Civita coordinate producer

on:
  pull_request:
    paths:
      - "curvature/**"
      - ".github/workflows/point4-chosen-lc-coordinate.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chosen_lc_coordinate:
    name: Exact-head actual chosen Levi-Civita coordinate producer and unchanged full audit
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: curvature
          build: false
      - name: Compile actual preferred coordinate frames first
        working-directory: curvature
        run: lake build PoincareCurvature.Analysis.PreferredCoordinateFrame
      - name: Compile pointwise Koszul identity
        working-directory: curvature
        run: lake build PoincareCurvature.Geometry.Manifold.VectorBundle.CovariantDerivative.LeviCivitaKoszulAt
      - name: Compile actual chosen Levi-Civita metric-coordinate producer
        working-directory: curvature
        run: lake build PoincareCurvature.Geometry.Manifold.RicciFlow.ChosenLeviCivitaCoordinateChristoffel
      - name: Check actual chosen-LC producer theorem axioms
        working-directory: curvature
        run: |
          lake env lean scripts/point4_chosen_lc_coordinate_probe.lean | tee /tmp/point4-chosen-lc-coordinate-axioms.log
          python3 - <<'PY'
          import pathlib, re
          output = pathlib.Path('/tmp/point4-chosen-lc-coordinate-axioms.log').read_text()
          entries = re.findall(r"'([^']+)' depends on axioms:\s*\[([^]]*)\]", output)
          clean = re.findall(r"'([^']+)' does not depend on any axioms?", output)
          expected = {
            'PoincareCurvature.PreferredCoordinateFrame.frame_eq_inverseChart_derivative',
            'PoincareCurvature.PreferredCoordinateFrame.mpullback_frame_eq_const',
            'PoincareCurvature.PreferredCoordinateFrame.mvfderiv_frame_eq_fderiv',
            'PoincareCurvature.PreferredCoordinateFrame.mlieBracket_frame_eq_zero',
            'PoincareCurvature.PreferredCoordinateFrame.toModel_coordinateVector',
            'PoincareCurvature.PreferredCoordinateFrame.fderiv_comp_toModel_coordinateVector',
            'CovariantDerivative.koszul_formula_at',
            'RicciFlow.isOpen_chosenLCCoordinateDomain',
            'RicciFlow.chosenLCMetricCoordinates_symm',
            'RicciFlow.contDiffOn_chosenLCMetricCoordinates',
            'RicciFlow.chosenLCMetricCoordinates_det_ne_zero_on_domain',
            'RicciFlow.first_chosenLCMetricCoordinates_eq_mvfderiv',
            'RicciFlow.chosenLC_inner_coordinateFrame_eq_first_metric',
            'RicciFlow.chosenLC_coordinateFrameCoeff_eq_christoffel',
            'RicciFlow.chosenLCConnectionCoordinates_eq_christoffel',
            'RicciFlow.chosenLCConnectionCoordinates_eventuallyEq_christoffel',
            'RicciFlow.differentiableAt_chosenLCConnectionCoordinates',
            'RicciFlow.fderiv_chosenLCConnectionCoordinates_apply',
          }
          assert {n for n, _ in entries} | set(clean) == expected, output
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name, axioms in entries:
            actual = {a.strip() for a in axioms.split(',') if a.strip()}
            assert actual <= allowed, (name, actual)
          print('All eighteen actual chosen-LC producer axiom surfaces passed')
          PY
      - name: Run unchanged full Point-4 completion audit
        working-directory: curvature
        run: |
          set +e
          bash scripts/point4_audit.sh --json /tmp/point4-chosen-lc-coordinate-full-audit.json | tee /tmp/point4-chosen-lc-coordinate-full-audit.log
          audit_rc=${PIPESTATUS[0]}
          set -e
          export POINT4_AUDIT_RC="$audit_rc"
          python3 - <<'PY'
          import json, os, pathlib
          data = json.loads(pathlib.Path('/tmp/point4-chosen-lc-coordinate-full-audit.json').read_text())
          assert data['build_run'] is True, data
          assert data['gates']['G1_sorry_free']['status'] == 'PASS', data
          assert data['gates']['G2_build_green']['status'] == 'PASS', data
          if data['verdict'] == 'CLOSED':
            assert os.environ['POINT4_AUDIT_RC'] == '0', data
            assert all(g['status'] == 'PASS' for g in data['gates'].values()), data
          else:
            assert data['verdict'] == 'OPEN', data
            assert os.environ['POINT4_AUDIT_RC'] == '1', data
            print('POINT 4 OPEN: the actual chosen Levi-Civita coordinate producer does not close the canonical theorem')
          PY
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: point4-chosen-lc-coordinate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/point4-chosen-lc-coordinate-axioms.log
            /tmp/point4-chosen-lc-coordinate-full-audit.json
            /tmp/point4-chosen-lc-coordinate-full-audit.log
            /tmp/point4_build.log
          if-no-files-found: ignore
