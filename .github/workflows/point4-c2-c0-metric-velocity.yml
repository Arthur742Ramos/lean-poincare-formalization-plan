name: Point-4 literal-C2 metric endpoint with continuous ordinary velocity

on:
  pull_request:
    paths:
      - "curvature/**"
      - "docs/point4/c2-c0-metric-velocity/**"
      - ".github/workflows/point4-c2-c0-metric-velocity.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c2_c0_metric_velocity:
    name: Exact-head literal-C2/C0 endpoint with unchanged full OPEN audit
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check immutable release HEAD and tracked cleanliness before candidate gates
        env:
          GIT_NO_LAZY_FETCH: '1'
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_SHA"
          /usr/bin/git --no-replace-objects -c core.fileMode=true -c core.fsmonitor=false diff --cached --no-ext-diff --no-textconv --ignore-submodules=none --exit-code HEAD -- .
          /usr/bin/git --no-replace-objects -c core.fileMode=true -c core.fsmonitor=false diff --no-ext-diff --no-textconv --ignore-submodules=none --exit-code -- .
          /usr/bin/python3 -I -B - <<'PY_TRACKED_SOURCE'
          import hashlib, os, pathlib, stat, subprocess
          root = pathlib.Path('.').absolute()
          def git(*args):
              return subprocess.check_output(['/usr/bin/git', '--no-replace-objects', '-C', str(root), *args])
          expected_sha = os.environ['EXPECTED_SHA']
          assert git('rev-parse', 'HEAD').decode().strip() == expected_sha, 'Independent expected release HEAD mismatch'
          head = {}
          for record in git('ls-tree', '-rz', expected_sha).split(b'\0')[:-1]:
              descriptor, name = record.split(b'\t', 1)
              mode, kind, oid = descriptor.decode().split()
              path = name.decode()
              assert kind == 'blob' and mode in {'100644', '100755'} and path not in head
              head[path] = (mode, oid)
          index = {}
          for record in git('ls-files', '--stage', '-z').split(b'\0')[:-1]:
              descriptor, name = record.split(b'\t', 1)
              mode, oid, stage = descriptor.decode().split()
              path = name.decode()
              assert stage == '0' and path not in index
              index[path] = (mode, oid)
          assert index == head, 'Independent tracked index/HEAD identity mismatch'
          for path, (mode, oid) in head.items():
              physical = root / path
              for parent in physical.parents:
                  assert stat.S_ISDIR(parent.lstat().st_mode), 'Independent tracked source directory/symlink drift'
                  if parent == root:
                      break
              actual_mode = physical.lstat().st_mode
              assert stat.S_ISREG(actual_mode) and bool(actual_mode & 0o111) == (mode == '100755'), 'Independent tracked source file/mode drift'
              data = physical.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob == oid, 'Independent tracked physical/HEAD blob mismatch: ' + path
          assert git('rev-parse', 'HEAD').decode().strip() == expected_sha, 'Independent expected release HEAD changed during tracked inspection'
          PY_TRACKED_SOURCE
      - name: Install pinned safe YAML parser from the official package registry
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple PyYAML==6.0.2 jsonschema==4.23.0
      - name: Read full official metadata schema with exact digest checked by source guard
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/v0.4.schema.json -o /tmp/point4-c2-c0-metric-velocity-official-schema.json
      - name: Check exact release union and all inherited and new adversarial fixtures
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat curvature/lean-toolchain)" = 'leanprover/lean4:v4.33.0'
          git rev-parse HEAD | tee /tmp/point4-c2-c0-metric-velocity-sha.log
          PYTHONDONTWRITEBYTECODE=1 python3 curvature/scripts/point4_c2_c0_metric_velocity_source_guard.py --schema /tmp/point4-c2-c0-metric-velocity-official-schema.json | tee /tmp/point4-c2-c0-metric-velocity-source.log
          PYTHONDONTWRITEBYTECODE=1 python3 curvature/scripts/point4_c2_initial_heat_mock_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 curvature/scripts/point4_linear_heat_geometry_mock_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 curvature/scripts/point4_c2_c0_metric_velocity_mock_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 curvature/scripts/point4_weighted_initial_heat_guard.py
          PYTHONDONTWRITEBYTECODE=1 python3 curvature/scripts/point4_closed_contract_source_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check-doc-links.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: curvature
          build: false
      - name: Compile all four actual metric endpoint modules on official Lean 4.33/db584
        working-directory: curvature
        run: |
          lake env lean --version | tee /tmp/point4-c2-c0-metric-velocity-toolchain.log
          grep -Eq '^Lean \(version 4\.33\.0,' /tmp/point4-c2-c0-metric-velocity-toolchain.log
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = db584cd6d46c92f209a44c0f1c829460d327499d
          lake build PoincareCurvature.Geometry.Manifold.RicciFlow.AnalyticPDE.C0GaussianEndpoint PoincareCurvature.Geometry.Manifold.RicciFlow.AnalyticPDE.C0FiniteAtlasGaussian PoincareCurvature.Geometry.Manifold.RicciFlow.AnalyticPDE.C0EndpointCompactPositivity PoincareCurvature.Geometry.Manifold.RicciFlow.AnalyticPDE.C2MetricVelocityExtension 2>&1 | tee /tmp/point4-c2-c0-metric-velocity-four-targets.log
      - name: Check full mathematical types, ordinary jets, rank-zero and canonical context, and 29 axiom surfaces
        working-directory: curvature
        run: |
          lake env lean scripts/point4_c2_c0_metric_velocity_probe.lean | tee /tmp/point4-c2-c0-metric-velocity-probe.log
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/point4_c2_c0_metric_velocity_source_guard.py --probe-log /tmp/point4-c2-c0-metric-velocity-probe.log
      - name: Compile unchanged full library before inherited evidence probes
        working-directory: curvature
        run: lake build 2>&1 | tee /tmp/point4-c2-c0-metric-velocity-inherited-build.log
      - name: Preserve all 150 inherited axiom occurrences and seven boundaryless types
        working-directory: curvature
        run: |
          mkdir -p /tmp/point4-c2-c0-metric-velocity-inherited-probes
          for probe in contraction coordinate_connection coordinate_jet coordinate_operator principal_remainder chosen_lc_coordinate chosen_lc_curvature standard_coordinate_operator frozen_metric_principal weak_laplacian boundaryless_chart_frames c2_heat_trace weighted_initial_heat; do
            lake env lean "scripts/point4_${probe}_probe.lean" 2>&1 | tee "/tmp/point4-c2-c0-metric-velocity-inherited-probes/${probe}.log"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/point4_c2_c0_metric_velocity_source_guard.py --axiom-dir /tmp/point4-c2-c0-metric-velocity-inherited-probes
      - name: Recheck unchanged full canonical contract and twelve kernel negative fixtures
        working-directory: curvature
        run: |
          lake env lean scripts/point4_closed_contract_probe.lean 2>&1 | tee /tmp/point4-c2-c0-metric-velocity-contract.log
          lake env lean scripts/point4_closed_contract_regression.lean 2>&1 | tee /tmp/point4-c2-c0-metric-velocity-regression.log
      - name: Run unchanged full Point-4 completion audit
        working-directory: curvature
        run: |
          set +e
          bash scripts/point4_audit.sh --json /tmp/point4-c2-c0-metric-velocity-full-audit.json | tee /tmp/point4-c2-c0-metric-velocity-full-audit.log
          audit_rc=${PIPESTATUS[0]}
          set -e
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/point4_c2_c0_metric_velocity_source_guard.py --schema /tmp/point4-c2-c0-metric-velocity-official-schema.json --probe-log /tmp/point4-c2-c0-metric-velocity-probe.log --axiom-dir /tmp/point4-c2-c0-metric-velocity-inherited-probes --audit-json /tmp/point4-c2-c0-metric-velocity-full-audit.json --audit-rc "$audit_rc"
      - name: Check immutable release HEAD and tracked cleanliness after candidate gates
        if: always()
        env:
          GIT_NO_LAZY_FETCH: '1'
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_SHA"
          /usr/bin/git --no-replace-objects -c core.fileMode=true -c core.fsmonitor=false diff --cached --no-ext-diff --no-textconv --ignore-submodules=none --exit-code HEAD -- .
          /usr/bin/git --no-replace-objects -c core.fileMode=true -c core.fsmonitor=false diff --no-ext-diff --no-textconv --ignore-submodules=none --exit-code -- .
          /usr/bin/python3 -I -B - <<'PY_TRACKED_SOURCE'
          import hashlib, os, pathlib, stat, subprocess
          root = pathlib.Path('.').absolute()
          def git(*args):
              return subprocess.check_output(['/usr/bin/git', '--no-replace-objects', '-C', str(root), *args])
          expected_sha = os.environ['EXPECTED_SHA']
          assert git('rev-parse', 'HEAD').decode().strip() == expected_sha, 'Independent expected release HEAD mismatch'
          head = {}
          for record in git('ls-tree', '-rz', expected_sha).split(b'\0')[:-1]:
              descriptor, name = record.split(b'\t', 1)
              mode, kind, oid = descriptor.decode().split()
              path = name.decode()
              assert kind == 'blob' and mode in {'100644', '100755'} and path not in head
              head[path] = (mode, oid)
          index = {}
          for record in git('ls-files', '--stage', '-z').split(b'\0')[:-1]:
              descriptor, name = record.split(b'\t', 1)
              mode, oid, stage = descriptor.decode().split()
              path = name.decode()
              assert stage == '0' and path not in index
              index[path] = (mode, oid)
          assert index == head, 'Independent tracked index/HEAD identity mismatch'
          for path, (mode, oid) in head.items():
              physical = root / path
              for parent in physical.parents:
                  assert stat.S_ISDIR(parent.lstat().st_mode), 'Independent tracked source directory/symlink drift'
                  if parent == root:
                      break
              actual_mode = physical.lstat().st_mode
              assert stat.S_ISREG(actual_mode) and bool(actual_mode & 0o111) == (mode == '100755'), 'Independent tracked source file/mode drift'
              data = physical.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob == oid, 'Independent tracked physical/HEAD blob mismatch: ' + path
          assert git('rev-parse', 'HEAD').decode().strip() == expected_sha, 'Independent expected release HEAD changed during tracked inspection'
          PY_TRACKED_SOURCE
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: point4-c2-c0-metric-velocity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/point4-c2-c0-metric-velocity-*.log
            /tmp/point4-c2-c0-metric-velocity-inherited-probes/*.log
            /tmp/point4-c2-c0-metric-velocity-full-audit.json
            /tmp/point4-c2-c0-metric-velocity-official-schema.json
            /tmp/point4-c2-c0-metric-velocity-full-audit.log
            /tmp/point4_build.log
          if-no-files-found: error
