name: Chart 2813 derived text evidence only

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Original chart producer SHA, fixed by independently reviewed source
        required: true
        type: string
      expected_tree:
        description: Original chart producer tree, fixed by independently reviewed source
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: chart2813-derived-text-evidence
  cancel-in-progress: false

jobs:
  derived_text_projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact projection source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Admit fixed source package and fresh evidence namespace
        env:
          PRODUCER_SHA: ${{ inputs.candidate_sha }}
          PRODUCER_TREE: ${{ inputs.expected_tree }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Arthur742Ramos/lean-poincare-formalization-plan
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/point4/chart2813-derived-text-evidence-20261016
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$PRODUCER_SHA" = 2813ef52a21e13be08532f36ee9f26faf319da72
          test "$PRODUCER_TREE" = 13f982c1be40478cc14b523ea76ed3642fb3ae7e
          test "$GITHUB_SHA" != "$PRODUCER_SHA"
          command -v /usr/bin/setpriv
          test "$(id -u)" -gt 0
          package="$GITHUB_WORKSPACE/.github/point4-chart-text-projection"
          test "$(sha256sum "$package/PINNED-SOURCES.sha256" | cut -d ' ' -f 1)" = a424ddf89978d0475f240d08ff616fea24e20d6d1e1450cabf4949c54e0e6ee2
          (cd "$package" && sha256sum --check --strict PINNED-SOURCES.sha256)
          root=/tmp/poincare-chart2813-projection
          test ! -e "$root"
          test ! -L "$root"
          umask 077
          mkdir "$root"
          mkdir "$root/source" "$root/input" "$root/prepared-source"
          cp -R "$package/." "$root/source/"
          cp "$package/primary/"*.json "$root/input/"
          mkdir -p "$root/prepared-source/curvature/scripts" "$root/prepared-source/.github/workflows"
          cp "$package/original/chart_port_ci.py" "$root/prepared-source/curvature/scripts/chart_port_ci.py"
          cp "$package/original/point4-local-chart-connection.yml" "$root/prepared-source/.github/workflows/point4-local-chart-connection.yml"
          (cd "$root/source" && sha256sum --check --strict PINNED-SOURCES.sha256)
      - name: Read fixed original artifact in separate finite transfer role
        env:
          PROJECTION_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/setpriv --no-new-privs /usr/bin/python3 -I -B \
            /tmp/poincare-chart2813-projection/source/trusted_artifact_transfer.py \
            --source-sha 5db387e5a763a6828b7e5e501d98583410ad3f3c8e3f8d156a3aca348ad9d5b3 \
            --projection-run "$GITHUB_RUN_ID" --projection-head "$GITHUB_SHA"
      - name: Seal observed transfer provenance after transfer termination
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/setpriv --no-new-privs /usr/bin/python3 -I -B \
            /tmp/poincare-chart2813-projection/source/build_projection_admission.py
      - name: Select only text using unchanged c6 and clean environment
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/poincare-chart2813-projection
          admission_sha=$(sha256sum "$root/pure/C6-ADMISSION.json" | cut -d ' ' -f 1)
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            /usr/bin/setpriv --no-new-privs /usr/bin/python3 -I -B \
            "$root/source/linux_singleton_launcher.py" \
            --admission "$root/pure/C6-ADMISSION.json" --admission-sha "$admission_sha" \
            --output-directory "$root/pure-controller" --wall-seconds 120 --cpu-seconds 120
      - name: Stage fixed derived text and bounded provenance allowlist
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/setpriv --no-new-privs /usr/bin/python3 -I -B \
            /tmp/poincare-chart2813-projection/source/stage_projection_upload.py
      - name: Upload new derived text evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chart2813-derived-text-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/poincare-chart2813-projection/public
          if-no-files-found: error
          retention-days: 14
