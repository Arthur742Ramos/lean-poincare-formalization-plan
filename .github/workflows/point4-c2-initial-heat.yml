name: Point-4 combined C2 initial heat

on:
  pull_request:
    paths:
      - "curvature/**"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c2_initial_heat:
    name: Exact-head C2 union, all 150 axiom occurrences, current contract and full audit
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact combined candidate with real ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned safe YAML parser from the official package registry
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple PyYAML==6.0.2
      - name: Check exact identity, pinned source union and adversarial fixtures
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD | tee /tmp/point4-c2-initial-heat-sha.log
          python3 curvature/scripts/point4_c2_initial_heat_source_test.py | tee /tmp/point4-c2-initial-heat-source.log
          python3 curvature/scripts/point4_c2_initial_heat_mock_test.py
          python3 curvature/scripts/point4_linear_heat_geometry_mock_test.py
          python3 curvature/scripts/point4_weighted_initial_heat_guard.py
          python3 curvature/scripts/point4_closed_contract_source_test.py
          python3 scripts/check-doc-links.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: curvature
          build: false
      - name: Compile the entire exact combined public library
        working-directory: curvature
        run: lake build 2>&1 | tee /tmp/point4-c2-initial-heat-build.log
      - name: Check all inherited geometry and actual heat axiom and type surfaces
        working-directory: curvature
        run: |
          mkdir -p /tmp/point4-c2-initial-heat-probes
          for probe in contraction coordinate_connection coordinate_jet coordinate_operator principal_remainder chosen_lc_coordinate chosen_lc_curvature standard_coordinate_operator frozen_metric_principal weak_laplacian boundaryless_chart_frames c2_heat_trace weighted_initial_heat; do
            lake env lean "scripts/point4_${probe}_probe.lean" 2>&1 | tee "/tmp/point4-c2-initial-heat-probes/${probe}.log"
          done
          python3 scripts/point4_c2_initial_heat_source_test.py --axiom-dir /tmp/point4-c2-initial-heat-probes
      - name: Recheck the original full canonical contract and kernel negative fixtures
        working-directory: curvature
        run: |
          lake env lean scripts/point4_closed_contract_probe.lean 2>&1 | tee /tmp/point4-c2-initial-heat-contract.log
          lake env lean scripts/point4_closed_contract_regression.lean 2>&1 | tee /tmp/point4-c2-initial-heat-regression.log
      - name: Run unchanged full five-gate Point-4 audit with actual build
        working-directory: curvature
        run: |
          set +e
          bash scripts/point4_audit.sh --json /tmp/point4-c2-initial-heat-full-audit.json | tee /tmp/point4-c2-initial-heat-full-audit.log
          audit_rc=${PIPESTATUS[0]}
          set -e
          python3 scripts/point4_c2_initial_heat_source_test.py --audit-json /tmp/point4-c2-initial-heat-full-audit.json --audit-rc "$audit_rc"
      - name: Retain exact-head evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: point4-c2-initial-heat-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/point4-c2-initial-heat-*.log
            /tmp/point4-c2-initial-heat-probes/*.log
            /tmp/point4-c2-initial-heat-full-audit.json
            /tmp/point4_build.log
          if-no-files-found: error
