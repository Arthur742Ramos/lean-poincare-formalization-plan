name: Symmetric tensor heat current Palomar renderer replay

# Replays the pinned current production renderer for the exact candidate SHA.
# This is a read-only preflight and creates no intake or registry entry.
on:
  pull_request:
    paths:
      - "symmetric-tensor-heat/**"
      - ".github/workflows/symmetric-tensor-heat-palomar-current-render.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout pinned production renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 1703d7babd984ccc3831cdf89c28221abe34808f
          path: pipeline
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11.10"

      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Bind exact Challenge hash
        run: echo "CHALLENGE_SHA256=$(sha256sum candidate/symmetric-tensor-heat/TensorHeatChallenge.lean | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Prepare renderer input from immutable source
        id: prepare
        working-directory: pipeline
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CHALLENGE_SHA256: ${{ env.CHALLENGE_SHA256 }}
        run: |
          python -m scripts.render_challenge prepare \
            --repository "$SOURCE_REPOSITORY" \
            --commit "$SOURCE_COMMIT" \
            --challenge-sha256 "$CHALLENGE_SHA256" \
            --project-path symmetric-tensor-heat \
            --challenge-path symmetric-tensor-heat/TensorHeatChallenge.lean \
            --solution-path symmetric-tensor-heat/TensorHeatSolution.lean \
            --comparator-config-path symmetric-tensor-heat/comparator.json \
            --lakefile-path symmetric-tensor-heat/lakefile.toml \
            --lean-toolchain-path symmetric-tensor-heat/lean-toolchain \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json"

      - name: Install pinned elan
        if: steps.prepare.outputs.ready == 'true'
        run: |
          python3 pipeline/scripts/trusted_download.py \
            --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/elan.tar.gz" \
            --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install accepted Lean toolchain
        if: steps.prepare.outputs.ready == 'true'
        env:
          LEAN_TOOLCHAIN: ${{ steps.prepare.outputs.lean_toolchain }}
        run: elan toolchain install "$LEAN_TOOLCHAIN"

      - name: Build pinned bubblewrap
        if: steps.prepare.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"

      - name: Execute renderer and core-notation audit under bubblewrap
        if: steps.prepare.outputs.ready == 'true'
        working-directory: pipeline
        run: |
          python -m scripts.render_challenge execute \
            --work-dir "$RUNNER_TEMP/palomar-render" \
            --output "$RUNNER_TEMP/palomar-render/report.json" \
            --bwrap "$PALOMAR_BWRAP" \
            --renderer-commit 1703d7babd984ccc3831cdf89c28221abe34808f \
            --bwrap-source-tag v0.12.0 \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Preserve renderer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-challenge-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/palomar-render/report.json
            ${{ runner.temp }}/palomar-render/result
          if-no-files-found: error
          retention-days: 30

      - name: Require a successful render
        if: always()
        run: |
          python -c 'import json, os, pathlib, sys; p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "palomar-render" / "report.json"; sys.exit(0 if json.loads(p.read_text())["status"] == "pass" else 1)'
