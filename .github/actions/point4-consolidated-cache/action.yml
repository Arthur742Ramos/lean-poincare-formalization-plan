name: Point-4 exact-candidate build cache
description: Verify an exact candidate cache before restoring outputs; save only after manual gates.
inputs:
  phase:
    description: restore before manual compilation, or save after all manual gates
    required: true
  targets-json:
    description: Literal JSON list of the unchanged explicit Lake targets
    required: true
  source-root:
    description: Absolute authenticated proof-source checkout; tooling provenance remains in the GitHub provider identity
    required: true
  source-repository:
    description: Repository of the actual checkout
    required: true
runs:
  using: composite
  steps:
    - name: Compute package-correct exact candidate identity
      id: identity
      if: inputs.phase == 'restore'
      shell: bash
      env:
        P4_EXECUTION_ROOT: ${{ inputs.source-root }}
        P4_TARGETS: ${{ inputs.targets-json }}
        P4_SOURCE_REPOSITORY: ${{ inputs.source-repository }}
      run: |
        set -euo pipefail
        python3 -B scripts/point4_cache/point4_ci_cache.py identity --root "$P4_EXECUTION_ROOT" --state-dir "$RUNNER_TEMP/point4-verified-cache" --targets-json "$P4_TARGETS" | tee -a /tmp/point4-consolidated-cache.log
    - name: Restore only the exact scoped cache into transport staging
      id: restore
      if: inputs.phase == 'restore'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/point4-verified-cache/snapshot
        key: ${{ steps.identity.outputs.key }}
        fail-on-cache-miss: false
        enableCrossOsArchive: false
    - name: Validate complete inventory before injecting any candidate output
      if: inputs.phase == 'restore'
      shell: bash
      env:
        P4_EXECUTION_ROOT: ${{ inputs.source-root }}
        P4_TARGETS: ${{ inputs.targets-json }}
        P4_SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        P4_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        P4_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        python3 -B scripts/point4_cache/point4_ci_cache.py restore --root "$P4_EXECUTION_ROOT" --state-dir "$RUNNER_TEMP/point4-verified-cache" --targets-json "$P4_TARGETS" --cache-hit "$P4_CACHE_HIT" --matched-key "$P4_MATCHED_KEY" | tee -a /tmp/point4-consolidated-cache.log
    - name: Snapshot only after all manual compilation and Source gates succeed
      id: snapshot
      if: inputs.phase == 'save' && success()
      shell: bash
      env:
        P4_EXECUTION_ROOT: ${{ inputs.source-root }}
        P4_TARGETS: ${{ inputs.targets-json }}
        P4_SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        P4_MANUAL_SUCCESS: ${{ job.status == 'success' }}
      run: |
        set -euo pipefail
        python3 -B scripts/point4_cache/point4_ci_cache.py snapshot --root "$P4_EXECUTION_ROOT" --state-dir "$RUNNER_TEMP/point4-verified-cache" --targets-json "$P4_TARGETS" --manual-success "$P4_MANUAL_SUCCESS" | tee -a /tmp/point4-consolidated-cache.log
        cp "$RUNNER_TEMP/point4-verified-cache/snapshot/inventory.json" /tmp/point4-consolidated-cache-inventory.json
    - name: Single writer publishes a successful cold candidate snapshot
      id: save
      if: inputs.phase == 'save' && steps.snapshot.outputs.can_save == 'true' && success()
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/point4-verified-cache/snapshot
        key: ${{ steps.snapshot.outputs.key }}
        enableCrossOsArchive: false
    - name: Record actual hit, bytes, validation and cache-action outcomes
      if: always() && inputs.phase == 'save' && steps.snapshot.outcome == 'success'
      shell: bash
      env:
        P4_EXECUTION_ROOT: ${{ inputs.source-root }}
        P4_TARGETS: ${{ inputs.targets-json }}
        P4_SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        P4_SAVE_OUTCOME: ${{ steps.save.outcome }}
      run: |
        set -euo pipefail
        python3 -B scripts/point4_cache/point4_ci_cache.py report --root "$P4_EXECUTION_ROOT" --state-dir "$RUNNER_TEMP/point4-verified-cache" --targets-json "$P4_TARGETS" --save-step-outcome "$P4_SAVE_OUTCOME" | tee -a /tmp/point4-consolidated-cache.log
